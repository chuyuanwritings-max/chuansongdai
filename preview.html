<script>

__def("js/core.js", function (module, exports, require) {
// 玩法核心：只有格子、连弩、传送带、槽位，不画图。
// 手机里、浏览器里、node 机器人里跑的都是这一份。画面层只读 g 和 g.events。

const CFG = {
  speed: 22, // 传送带速度：格 / 秒（绕一圈约 6 秒）
  fireCd: 0.018, // 两发之间最少隔多久（秒）
  corner: 3, // 拐角算几格长
  perLane: 1, // 经过一列 / 一行，小连弩射几发（底子的规矩：一发）
  bigPerLane: 2, // 合体大连弩射两发
  beltCap: 3, // 传送带上最多几台（机器人量过：3 台时「会玩」和「乱点」差得最开，差一点也最多）
  gap: 3, // 两台连弩在传送带上至少隔几格
  merge: true, // 槽里同色三台合体
  rescue: true, // 槽满时刚好凑成三台也算救回来
};

// 颜色：字母 → 序号。关卡图里用字母画。
const ORDER = 'ROYGTBPK';

function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// scale = 每个字母画成几乘几的小格（2 = 像沙画那样细碎）
function parseArt(art, scale) {
  const z = scale || 1;
  const rows = art.map((r) => r.trim());
  const h0 = rows.length;
  const w0 = rows[0].length;
  const w = w0 * z;
  const h = h0 * z;
  const cells = new Int8Array(w * h).fill(-1);
  for (let y = 0; y < h0; y++) {
    if (rows[y].length !== w0) throw new Error('关卡图第 ' + (y + 1) + ' 行长度不对');
    for (let x = 0; x < w0; x++) {
      const k = ORDER.indexOf(rows[y][x]);
      if (k < 0) continue;
      for (let dy = 0; dy < z; dy++) for (let dx = 0; dx < z; dx++) cells[(y * z + dy) * w + x * z + dx] = k;
    }
  }
  return { w, h, cells };
}

// 每格「埋得多深」：四个方向里，挡在它前面最少有几格
function depthMap(cells, w, h) {
  const d = new Int16Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      if (cells[y * w + x] < 0) continue;
      let a = 0, b = 0, c = 0, e = 0;
      for (let k = y + 1; k < h; k++) if (cells[k * w + x] >= 0) a++;
      for (let k = y - 1; k >= 0; k--) if (cells[k * w + x] >= 0) b++;
      for (let k = x + 1; k < w; k++) if (cells[y * w + k] >= 0) c++;
      for (let k = x - 1; k >= 0; k--) if (cells[y * w + k] >= 0) e++;
      d[y * w + x] = Math.min(a, b, c, e);
    }
  return d;
}

// —— 传送带的形状：一圈圆角矩形，从左下角进，顺着「下 → 右 → 上 → 左」绕一圈 ——
function loopLen(w, h) {
  return 2 * w + 2 * h + 4 * CFG.corner;
}

// 第 s 格时正对着哪一条线（列或行），拐角处返回 null
function laneAt(s, w, h) {
  const C = CFG.corner;
  let t = s;
  if (t < C) return null;
  t -= C;
  if (t < w) return { dir: 0, k: Math.floor(t) }; // 下边，朝上打第 k 列
  t -= w;
  if (t < C) return null;
  t -= C;
  if (t < h) return { dir: 1, k: h - 1 - Math.floor(t) }; // 右边，朝左打第 k 行
  t -= h;
  if (t < C) return null;
  t -= C;
  if (t < w) return { dir: 2, k: w - 1 - Math.floor(t) }; // 上边，朝下
  t -= w;
  if (t < C) return null;
  t -= C;
  if (t < h) return { dir: 3, k: Math.floor(t) }; // 左边，朝右
  return null;
}

// 这条线上从外往里第一个还在的格子
function firstInLane(cells, w, h, dir, k) {
  if (dir === 0) {
    for (let y = h - 1; y >= 0; y--) if (cells[y * w + k] >= 0) return y * w + k;
  } else if (dir === 1) {
    for (let x = w - 1; x >= 0; x--) if (cells[k * w + x] >= 0) return k * w + x;
  } else if (dir === 2) {
    for (let y = 0; y < h; y++) if (cells[y * w + k] >= 0) return y * w + k;
  } else {
    for (let x = 0; x < w; x++) if (cells[k * w + x] >= 0) return k * w + x;
  }
  return -1;
}

// 画面用：传送带上第 s 格在哪（单位是格，棋盘左上角是 0,0），o = 传送带离棋盘多远
function beltPos(s, w, h, o) {
  const L = loopLen(w, h);
  let t = ((s % L) + L) % L;
  const arc = (cx, cy, a0, a1, f) => {
    const a = a0 + (a1 - a0) * f;
    return { x: cx + o * Math.cos(a), y: cy + o * Math.sin(a), dir: null };
  };
  const P = Math.PI;
  const C = CFG.corner;
  if (t < C) return arc(0, h, P, P / 2, t / C);
  t -= C;
  if (t < w) return { x: t, y: h + o, dir: 0 };
  t -= w;
  if (t < C) return arc(w, h, P / 2, 0, t / C);
  t -= C;
  if (t < h) return { x: w + o, y: h - t, dir: 1 };
  t -= h;
  if (t < C) return arc(w, 0, 0, -P / 2, t / C);
  t -= C;
  if (t < w) return { x: w - t, y: -o, dir: 2 };
  t -= w;
  if (t < C) return arc(0, 0, -P / 2, -P, t / C);
  t -= C;
  return { x: -o, y: t, dir: 3 };
}

// —— 一局 ——
// level: { w, h, cells, cols: [[{color, ammo}]], slots }
// opts: { extraSlots, dog（大连弩多转一圈）, turtle（槽满救一次） }
function createGame(level, opts) {
  opts = opts || {};
  const counts = new Array(ORDER.length).fill(0);
  let total = 0;
  for (let i = 0; i < level.cells.length; i++) {
    if (level.cells[i] >= 0) {
      counts[level.cells[i]]++;
      total++;
    }
  }
  let id = 1;
  const g = {
    w: level.w,
    h: level.h,
    L: loopLen(level.w, level.h),
    cells: new Int8Array(level.cells),
    counts,
    total,
    left: total,
    cols: level.cols.map((c) => c.map((s) => ({ id: id++, color: s.color, ammo: s.ammo, big: 0 }))),
    belt: [],
    entering: [],
    slots: new Array(level.slots + (opts.extraSlots || 0)).fill(null),
    time: 0,
    status: 'play', // play / win / full
    overflow: null,
    adsUsed: 0,
    turtle: opts.turtle ? 1 : 0,
    dog: !!opts.dog,
    events: [],
    taps: 0,
  };
  return g;
}

function onBelt(g) {
  return g.belt.length + g.entering.length;
}

function canLaunch(g) {
  return g.status === 'play' && onBelt(g) < CFG.beltCap;
}

function launch(g, s, from, i) {
  s.s = 0;
  s.cd = 0;
  s.lane = -1;
  s.laneShots = 0;
  s.extra = false;
  g.entering.push(s);
  g.taps++;
  g.events.push({ type: 'launch', from, i, sh: s });
}

function tapColumn(g, i) {
  const c = g.cols[i];
  if (!c || !c.length) return false;
  if (!canLaunch(g)) {
    g.events.push({ type: 'beltFull' });
    return false;
  }
  launch(g, c.shift(), 'col', i);
  return true;
}

function tapSlot(g, i) {
  const s = g.slots[i];
  if (!s) return false;
  if (!canLaunch(g)) {
    g.events.push({ type: 'beltFull' });
    return false;
  }
  g.slots[i] = null;
  launch(g, s, 'slot', i);
  return true;
}

function freeSlots(g) {
  let n = 0;
  for (const s of g.slots) if (!s) n++;
  return n;
}

// 槽里同色三台 → 合成一台大连弩（我们改的三成之一）
function mergeCheck(g) {
  if (!CFG.merge) return;
  let merged = true;
  while (merged) {
    merged = false;
    for (let c = 0; c < ORDER.length && !merged; c++) {
      const idx = [];
      g.slots.forEach((s, i) => s && s.color === c && idx.push(i));
      if (idx.length >= 3) {
        const [a, b, d] = idx;
        const parts = [g.slots[a], g.slots[b], g.slots[d]];
        const big = { id: parts[0].id, color: c, ammo: parts[0].ammo + parts[1].ammo + parts[2].ammo, big: Math.min(3, 1 + Math.max(parts[0].big, parts[1].big, parts[2].big)) };
        g.slots[a] = big;
        g.slots[b] = null;
        g.slots[d] = null;
        g.events.push({ type: 'merge', at: a, from: [b, d], sh: big });
        merged = true;
      }
    }
  }
}

function backToSlot(g, s) {
  const free = g.slots.indexOf(null);
  if (free >= 0) {
    g.slots[free] = s;
    g.events.push({ type: 'toSlot', at: free, sh: s });
    mergeCheck(g);
    if (freeSlots(g) <= 1) g.events.push({ type: 'warn', free: freeSlots(g) });
    return;
  }
  // 满了：能和槽里两台同色凑成三台，就当场合体，不算输
  const same = [];
  g.slots.forEach((x, i) => x && x.color === s.color && same.push(i));
  if (CFG.merge && CFG.rescue && same.length >= 2) {
    const [a, b] = same;
    const big = { id: s.id, color: s.color, ammo: s.ammo + g.slots[a].ammo + g.slots[b].ammo, big: Math.min(3, 1 + Math.max(s.big, g.slots[a].big, g.slots[b].big)) };
    g.slots[a] = big;
    g.slots[b] = null;
    g.events.push({ type: 'merge', at: a, from: [b], sh: big, rescue: true });
    return;
  }
  if (g.turtle > 0) {
    g.turtle--;
    g.slots.push(s);
    g.events.push({ type: 'turtle', at: g.slots.length - 1, sh: s });
    return;
  }
  g.status = 'full';
  g.overflow = s;
  g.events.push({ type: 'full', sh: s });
}

// 看广告：机关匣加一格，接着打
function adContinue(g) {
  if (g.status !== 'full' || !g.overflow) return false;
  g.slots.push(g.overflow);
  g.events.push({ type: 'toSlot', at: g.slots.length - 1, sh: g.overflow, ad: true });
  g.overflow = null;
  g.status = 'play';
  g.adsUsed++;
  mergeCheck(g);
  return true;
}

function step(g, dt) {
  if (g.status !== 'play') return;
  g.time += dt;
  // 排队的连弩：前面那台走开 gap 格才上
  if (g.entering.length) {
    let minS = Infinity;
    for (const b of g.belt) if (b.s < minS) minS = b.s;
    if (minS >= CFG.gap) g.belt.push(g.entering.shift());
  }
  for (let i = 0; i < g.belt.length; i++) {
    const s = g.belt[i];
    s.s += CFG.speed * dt;
    s.cd -= dt;
    if (s.s >= g.L) {
      if (g.dog && s.big && !s.extra) {
        s.s -= g.L;
        s.extra = true;
        g.events.push({ type: 'dogLap', sh: s });
        continue;
      }
      g.belt.splice(i, 1);
      i--;
      backToSlot(g, s);
      if (g.status !== 'play') return;
      continue;
    }
    if (s.cd > 0) continue;
    const ln = laneAt(s.s, g.w, g.h);
    if (!ln) continue;
    const key = ln.dir * 100 + ln.k;
    if (key !== s.lane) {
      s.lane = key;
      s.laneShots = 0;
    }
    if (s.laneShots >= (s.big ? CFG.bigPerLane : CFG.perLane)) continue;
    const idx = firstInLane(g.cells, g.w, g.h, ln.dir, ln.k);
    if (idx < 0 || g.cells[idx] !== s.color) continue;
    // 射中
    g.cells[idx] = -1;
    g.left--;
    g.counts[s.color]--;
    s.ammo--;
    s.laneShots++;
    s.cd = CFG.fireCd;
    g.events.push({ type: 'shot', idx, color: s.color, sh: s });
    if (g.counts[s.color] === 0) g.events.push({ type: 'colorClear', color: s.color });
    if (s.ammo <= 0) {
      g.belt.splice(i, 1);
      i--;
      g.events.push({ type: 'empty', sh: s });
    }
    if (g.left === 0) {
      g.status = 'win';
      g.events.push({ type: 'win' });
      return;
    }
  }
}

// —— 机器人 ——
// 估一估：这台连弩现在上去，绕一圈大概能射掉几格（不管别的连弩）
function estimate(g, s, scratch) {
  const c = scratch || new Int8Array(g.cells.length);
  c.set(g.cells);
  const perLane = s.big ? CFG.bigPerLane : CFG.perLane;
  let ammo = s.ammo;
  let hits = 0;
  const lanes = [
    [0, g.w, (j) => j],
    [1, g.h, (j) => g.h - 1 - j],
    [2, g.w, (j) => g.w - 1 - j],
    [3, g.h, (j) => j],
  ];
  for (const [dir, n, kf] of lanes) {
    for (let j = 0; j < n && ammo > 0; j++) {
      for (let r = 0; r < perLane && ammo > 0; r++) {
        const idx = firstInLane(c, g.w, g.h, dir, kf(j));
        if (idx < 0 || c[idx] !== s.color) break;
        c[idx] = -1;
        ammo--;
        hits++;
      }
    }
  }
  return hits;
}

// 挑下一步点哪台。noise = 有多大概率乱点（装成真人）
function botPick(g, rnd, noise) {
  if (!canLaunch(g)) return null;
  const cands = [];
  g.cols.forEach((c, i) => c.length && cands.push({ kind: 'col', i, s: c[0] }));
  g.slots.forEach((s, i) => s && cands.push({ kind: 'slot', i, s }));
  if (!cands.length) return null;
  const scratch = new Int8Array(g.cells.length);
  let best = null;
  for (const c of cands) {
    c.hits = estimate(g, c.s, scratch);
    c.score = c.hits >= c.s.ammo ? 1000 + c.hits : c.hits + (c.kind === 'slot' && c.hits > 0 ? 0.5 : 0);
    if (!best || c.score > best.score) best = c;
  }
  // 装成真人：失手时多半是「在打得到的几台里随手挑了一台」，偶尔才完全点错
  if (noise && rnd() < noise) {
    const ok = cands.filter((c) => c.hits > 0);
    if (ok.length && rnd() < 0.8) return ok[Math.floor(rnd() * ok.length)];
    return cands[Math.floor(rnd() * cands.length)];
  }
  if (best.hits > 0) return best;
  if (onBelt(g) > 0) return null; // 等传送带上的先把外层清掉
  // 谁都打不到：掀开一列，挑后面那台最有用的
  let dig = null;
  for (const c of cands) {
    if (c.kind !== 'col') continue;
    const next = g.cols[c.i][1];
    const v = next ? estimate(g, next, scratch) : -1;
    if (!dig || v > dig.v) dig = Object.assign(c, { v });
  }
  return dig || cands[0];
}

function botTap(g, pick) {
  return pick.kind === 'col' ? tapColumn(g, pick.i) : tapSlot(g, pick.i);
}

// 无头跑一局：返回 { win, time, left, total, taps }
function simulate(level, seed, opt) {
  opt = opt || {};
  const g = createGame(level, opt.gameOpts);
  const r = rng(seed);
  const dt = 1 / 30;
  const noise = opt.noise || 0;
  let wait = 0;
  while (g.status === 'play' && g.time < (opt.maxTime || 600)) {
    wait -= dt;
    if (wait <= 0) {
      const p = botPick(g, r, noise);
      if (p) {
        botTap(g, p);
        wait = (opt.react || 0.25) * (0.6 + r() * 0.8);
      } else wait = 0.1;
    }
    step(g, dt);
    g.events.length = 0;
  }
  return { win: g.status === 'win', time: g.time, left: g.left, total: g.total, taps: g.taps, free: freeSlots(g) };
}

// 闭眼乱点：能点就随便点一台（用来查「会玩和乱点差多少」，差得少 = 选择不重要 = 不好玩）
function simulateRandom(level, seed, opt) {
  opt = opt || {};
  const g = createGame(level, opt.gameOpts);
  const r = rng(seed);
  const dt = 1 / 30;
  let wait = 0;
  while (g.status === 'play' && g.time < 900) {
    wait -= dt;
    if (wait <= 0 && canLaunch(g)) {
      const c = [];
      g.cols.forEach((x, i) => x.length && c.push({ kind: 'col', i }));
      g.slots.forEach((x, i) => x && c.push({ kind: 'slot', i }));
      if (c.length) botTap(g, c[Math.floor(r() * c.length)]);
      wait = (opt.react || 0.6) * (0.6 + r() * 0.8);
    }
    step(g, dt);
    g.events.length = 0;
  }
  return { win: g.status === 'win', time: g.time, left: g.left, total: g.total };
}

// —— 给一张图就出一关 ——
// def: { art: [...字符串], cols: 列数, slots: 槽数, chunks: [每台子弹数可选值] }
// 数每种颜色多少格 → 拆成一台台连弩 → 洗牌发进几列 → 机器人试打一遍，保证有解
function buildLevel(def, seed) {
  // fill：把空白填成一种「图纸底色」。整张填满，里层颜色被外层挡住，才要想先放哪台（底子的核心压力）
  const art = def.fill ? def.art.map((r) => r.replace(/\./g, def.fill)) : def.art;
  const img = parseArt(art, def.scale || 2);
  const r = rng(seed);
  const counts = new Array(ORDER.length).fill(0);
  const depthSum = new Array(ORDER.length).fill(0);
  const dm = depthMap(img.cells, img.w, img.h);
  img.cells.forEach((c, i) => {
    if (c >= 0) {
      counts[c]++;
      depthSum[c] += dm[i];
    }
  });
  let maxDepth = 1;
  counts.forEach((n, c) => n && (maxDepth = Math.max(maxDepth, depthSum[c] / n)));
  const shooters = [];
  const chunks = def.chunks || [10, 20, 30, 40];
  const maxChunk = Math.max.apply(null, chunks);
  counts.forEach((n, color) => {
    while (n > 0) {
      let a = Math.min(n, chunks[Math.floor(r() * chunks.length)]);
      if (n - a > 0 && n - a < 10) a = n; // 别剩零头
      shooters.push({ color, ammo: a, depth: depthSum[color] / counts[color] / maxDepth });
      n -= a;
    }
  });
  // bury：越大，埋在里层的颜色越容易排在前面（越难）。机器人打不过就一点点放松
  let bury = def.bury || 0;
  let lvl = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    // tail < 0：子弹少的小连弩往后排 → 快清完时还剩好多台、一圈圈回槽堵车，输也输在最后一点（机器人量过：比反过来排「差一点」多一倍）
    const tail = def.tail === undefined ? -2 : def.tail;
    const keyed = shooters.map((s) => ({ s, key: r() - bury * s.depth + (tail * s.ammo) / maxChunk }));

      const from = beltXY(e.sh.s);
      const to = cellCenter(e.idx);
      S.bullets.push({ x0: from.x + Math.cos(from.ang) * S.L.cartR, y0: from.y + Math.sin(from.ang) * S.L.cartR, x1: to.x, y1: to.y, t: 0, dur: 0.07, color: e.color, idx: e.idx });
      S.lastShotT = S.time;
      break;
    }
    case 'launch': {
      const sh = e.sh;
      if (e.from === 'col') sh.from = { x: colX(e.i, g.cols.length), y: colItemY(0) };
      else sh.from = slotPos(e.i, g.slots.length);
      sh.flyT = 0;
      S.rings.push({ x: sh.from.x, y: sh.from.y, r0: 10, r1: 34, t: 0, dur: 0.25, color: COL[sh.color].light });
      P.sound('launch', 0.5);
      P.vibrate(false);
      if (!save.hinted) {
        save.hinted = true;
        persist();
      }
      break;
    }
    case 'empty': {
      const p = beltXY(e.sh.s);
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2;
        S.parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 40, life: 0.6, max: 0.6, color: '#ece6dc', size: 5 + Math.random() * 4, soft: true });
      }
      S.rings.push({ x: p.x, y: p.y, r0: 8, r1: 30, t: 0, dur: 0.3, color: '#fff3c4' });
      P.sound('empty', 0.5);
      break;
    }
    case 'toSlot': {
      const sh = e.sh;
      sh.from = sh.lastXY ? { x: sh.lastXY.x, y: sh.lastXY.y } : slotPos(e.at, g.slots.length);
      sh.flyT = 0;
      P.sound('slot', 0.5);
      break;
    }
    case 'warn':
      S.slotFlash = 0.8;
      P.sound('warn', 0.5);
      break;
    case 'merge': {
      const to = slotPos(e.at, g.slots.length);
      for (const fi of e.from) {
        const f = slotPos(fi, g.slots.length);
        S.ghosts.push({ x0: f.x, y0: f.y, x1: to.x, y1: to.y, t: 0, dur: 0.18, color: e.sh.color });
      }
      e.sh.flyT = 0.18;
      e.sh.popT = 0;
      S.hitstop = 0.06;
      S.shake = Math.max(S.shake, 4);
      S.flash = Math.max(S.flash, 0.25);
      S.rings.push({ x: to.x, y: to.y, r0: 10, r1: 70, t: 0, dur: 0.4, color: COL[e.sh.color].light });
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        S.parts.push({ x: to.x, y: to.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.5, max: 0.5, color: COL[e.sh.color].base, size: 5 });
      }
      P.sound('merge', 0.7);
      P.vibrate(true);
      break;
    }
    case 'colorClear': {
      S.shake = Math.max(S.shake, 6);
      S.hitstop = Math.max(S.hitstop, 0.08);
      const L = S.L;
      S.rings.push({ x: L.bx + L.bw / 2, y: L.by + L.bh / 2, r0: 20, r1: L.bw * 0.8, t: 0, dur: 0.5, color: COL[e.color].light });
      P.sound('clear', 0.6);
      break;
    }
    case 'win':
      S.stats.rounds.push({ win: true, time: S.time - S.roundStart, left: 0, level: S.levelNo });
      giveReward(true);
      break;
    case 'full':
      S.stats.rounds.push({ win: false, time: S.time - S.roundStart, left: g.left / g.total, level: S.levelNo });
      giveReward(false);
      S.shake = 8;
      P.sound('lose', 0.6);
      P.vibrate(true);
      break;
    case 'turtle':
    case 'dogLap': {
      const p = e.type === 'turtle' ? slotPos(e.at, g.slots.length) : beltXY(e.sh.s);
      S.floaters.push({ x: p.x, y: p.y - 20, pet: e.type === 'turtle' ? 'turtle' : 'dog', t: 0 });
      P.sound('pet', 0.6);
      break;
    }
    case 'beltFull':
      S.beltFlash = 0.5;
      P.sound('nope', 0.5);
      break;
  }
}

function giveReward(win) {
  const g = S.g;
  const n = S.levelNo;
  const r = { win, coins: 0, pet: null, scene: n % ART.COUNT, pageDone: false, doubled: false };
  if (win) {
    r.coins = 20 + 5 * Math.min(n, 10);
    if (save.pets.que) r.coins = Math.round(r.coins * 1.5);
    if (!save.album[r.scene]) {
      save.album[r.scene] = true;
      save.newAlbum = true;
      const page = Math.floor(r.scene / 4);
      r.pageDone = [0, 1, 2, 3].every((k) => save.album[page * 4 + k]);
    }
    for (const p of PETS) {
      if (p.at === n && !save.pets[p.id]) {
        save.pets[p.id] = true;
        r.pet = p;
      }
    }
  } else {
    r.coins = 3 + Math.floor((1 - g.left / g.total) * 10);
  }
  save.coins += r.coins;
  persist();
  S.reward = r;
}

// —— 每帧 ——
function update(dt) {
  dt *= S.timeScale;
  S.time += dt;
  if (S.toast) {
    S.toast.t -= dt;
    if (S.toast.t <= 0) S.toast = null;
  }
  if (S.ad) {
    S.ad.t -= dt;
    if (S.ad.t <= 0) {
      const cb = S.ad.cb;
      S.ad = null;
      cb();
    }
    return;
  }
  const g = S.g;
  // 特效
  for (let i = S.bullets.length - 1; i >= 0; i--) {
    const b = S.bullets[i];
    b.t += dt;
    if (b.t >= b.dur) {
      S.bullets.splice(i, 1);
      clearCell(b.idx);
      const k = COL[b.color];
      for (let j = 0; j < 3; j++) {
        const a = Math.random() * Math.PI * 2;
        const v = 40 + Math.random() * 90;
        S.parts.push({ x: b.x1, y: b.y1, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0.45, max: 0.45, color: j ? k.base : k.light, size: S.L.cs * 0.55 });
      }
      if (S.time - S.lastPop > 0.028) {
        S.combo = S.time - S.lastPop < 0.25 ? Math.min(11, S.combo + 1) : 0;
        S.lastPop = S.time;
        P.sound('pop' + Math.floor(S.combo), 0.35);
      }
    }
  }
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i];
    p.life -= dt;
    if (p.life <= 0) {
      S.parts.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.soft ? -20 : 420) * dt;
  }
  for (const list of [S.rings, S.ghosts, S.floaters]) {
    for (let i = list.length - 1; i >= 0; i--) {
      list[i].t += dt;
      if (list[i].t >= (list[i].dur || 0.9)) list.splice(i, 1);
    }
  }
  S.shake = Math.max(0, S.shake - dt * 30);
  S.flash = Math.max(0, S.flash - dt * 2.5);
  S.slotFlash = Math.max(0, S.slotFlash - dt);
  S.beltFlash = Math.max(0, S.beltFlash - dt);
  if (!g) return;
  for (const sh of allShooters()) {
    if (sh.flyT !== undefined) sh.flyT += dt;
    if (sh.popT !== undefined) sh.popT += dt;
  }
  if (S.album.open) return;
  if (S.hitstop > 0) {
    S.hitstop -= dt;
  } else if (g.status === 'play') {
    S.acc += dt;
    while (S.acc >= STEP) {
      core.step(g, STEP);
      S.acc -= STEP;
      for (const e of g.events) onEvent(e);
      g.events.length = 0;
      if (g.status !== 'play') break;
    }
  }
  for (const e of g.events) onEvent(e);
  g.events.length = 0;
  if (g.status !== 'play') {
    S.endT += dt;
    if (g.status === 'win' && S.revealT < 0 && S.bullets.length === 0) {
      S.revealT = 0;
      S.flash = 0.6;
      S.hitstop = 0.15;
      P.sound('win', 0.7);
      setTimeout0(() => P.sound('reveal', 0.6), 300);
    }
    if (S.revealT >= 0) S.revealT += dt;
    if (S.stats.lastEnd === null) S.stats.lastEnd = S.time;
  }
}

let pendingTimers = [];
function setTimeout0(fn, ms) {
  pendingTimers.push({ at: S.time + ms / 1000, fn });
}
function runTimers() {
  for (let i = pendingTimers.length - 1; i >= 0; i--) {
    if (S.time >= pendingTimers[i].at) {
      const f = pendingTimers[i].fn;
      pendingTimers.splice(i, 1);
      f();
    }
  }
}

function allShooters() {
  const g = S.g;
  const out = [];
  for (const s of g.belt) out.push(s);
  for (const s of g.entering) out.push(s);
  for (const s of g.slots) if (s) out.push(s);
  return out;
}

// —— 画 ——
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function circle(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
}

function text(str, x, y, size, color, align, stroke) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineWidth = Math.max(2, size / 5);
    ctx.strokeStyle = stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function coinIcon(x, y, r) {
  circle(x, y, r);
  ctx.fillStyle = '#f5cf4c';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.fillStyle = '#a8851a';
  ctx.fillRect(x - r * 0.3, y - r * 0.3, r * 0.6, r * 0.6);
}

// 一台蒸汽连弩车
function drawShooter(x, y, r, sh, ang, alpha) {
  const k = COL[sh.color];
  const big = sh.big || 0;
  r *= 1 + 0.16 * big;
  if (sh.popT !== undefined && sh.popT < 0.3) r *= 1 + 0.35 * Math.sin((sh.popT / 0.3) * Math.PI);
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(x, y);
  // 合体大连弩：外面一圈转动的齿轮
  if (big) {
    ctx.save();
    ctx.rotate(S.time * 2.5);
    ctx.beginPath();
    const teeth = 10;
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2;
      const q = i % 2 === 0 ? r * 1.22 : r * 1.02;
      ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q);
      ctx.lineTo(Math.cos(a + Math.PI / teeth) * q, Math.sin(a + Math.PI / teeth) * q);
    }
    ctx.closePath();
    ctx.fillStyle = BRASS_L;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.restore();
  }
  // 弩口
  ctx.save();
  ctx.rotate(ang === undefined ? -Math.PI / 2 : ang);
  ctx.fillStyle = BRASS_D;
  ctx.fillRect(r * 0.5, -r * 0.22, r * 0.75, r * 0.44);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = INK;
  ctx.strokeRect(r * 0.5, -r * 0.22, r * 0.75, r * 0.44);
  ctx.restore();
  // 铜座
  circle(0, 0, r);
  ctx.fillStyle = BRASS;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  // 颜色核心
  circle(0, 0, r * 0.76);
  ctx.fillStyle = k.base;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.76, Math.PI * 1.05, Math.PI * 1.6);
  ctx.lineWidth = r * 0.16;
  ctx.strokeStyle = k.light;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.76, Math.PI * 0.1, Math.PI * 0.75);
  ctx.strokeStyle = k.dark;
  ctx.stroke();
  // 子弹数
  text(String(sh.ammo), 0, 1, Math.round(r * (sh.ammo >= 100 ? 0.62 : 0.8)), '#fff', 'center', INK);
  ctx.restore();
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function ease(t) {
  t = Math.max(0, Math.min(1, t));
  return 1 - Math.pow(1 - t, 3);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#22171f');
  g.addColorStop(1, '#120d14');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.07;
  ART.gear(ctx, W * 0.1, H * 0.62, W * 0.3, 14, BRASS, S.time * 0.1, 2);
  ART.gear(ctx, W * 0.95, H * 0.85, W * 0.22, 11, BRASS, -S.time * 0.14, 2);
  ctx.globalAlpha = 1;
}

function drawTopBar() {
  const L = S.L;
  const g = S.g;
  const y = L.top + L.barH / 2;
  // 第几关
  rr(12, y - 15, 74, 30, 15);
  ctx.fillStyle = '#2e2128';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = BRASS_D;
  ctx.stroke();
  text('第 ' + (S.levelNo + 1) + ' 关', 49, y + 1, 15, BRASS_L);
  // 进度条
  const px = 98;
  const pw = W - px - 128;
  rr(px, y - 7, pw, 14, 7);
  ctx.fillStyle = '#2e2128';
  ctx.fill();
  const f = 1 - g.left / g.total;
  if (f > 0) {
    rr(px, y - 7, Math.max(14, pw * f), 14, 7);
    ctx.fillStyle = BRASS;
    ctx.fill();
  }
  rr(px, y - 7, pw, 14, 7);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // 金币
  coinIcon(W - 108, y, 9);
  text(String(save.coins), W - 95, y + 1, 15, '#fff3c4', 'left');
  // 画册按钮
  const bx = W - 34;
  rr(bx - 18, y - 16, 36, 32, 8);
  ctx.fillStyle = '#6b3a2a';
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#f2e6cc';
  ctx.fillRect(bx - 11, y - 10, 9, 20);
  ctx.fillRect(bx + 2, y - 10, 9, 20);
  ctx.fillStyle = BRASS;
  ctx.fillRect(bx - 1, y - 11, 2, 22);
  if (save.newAlbum) {
    circle(bx + 15, y - 14, 5);
    ctx.fillStyle = '#ff4d4d';
    ctx.fill();
  }
  S.buttons.push({ id: 'album', x: bx - 22, y: y - 20, w: 44, h: 40, fn: openAlbum });
}

function drawBoard() {
  const L = S.L;
  const g = S.g;
  // 铜框
  rr(L.bx - 6, L.by - 6, L.bw + 12, L.bh + 12, 6);
  ctx.fillStyle = BRASS_D;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  for (const [x, y] of [[L.bx - 3, L.by - 3], [L.bx + L.bw + 3, L.by - 3], [L.bx - 3, L.by + L.bh + 3], [L.bx + L.bw + 3, L.by + L.bh + 3]]) {
    circle(x, y, 2.5);
    ctx.fillStyle = BRASS_L;
    ctx.fill();
  }
  ctx.drawImage(S.illus, L.bx, L.by, L.bw, L.bh);
  // 过关：剩下的蓝图纸从中间往外烧开，整张插画露出来
  if (S.revealT >= 0) {
    const t = ease(S.revealT / 0.9);
    if (t < 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(L.bx, L.by, L.bw, L.bh);
      ctx.arc(L.bx + L.bw / 2, L.by + L.bh / 2, t * L.bw * 0.75, 0, Math.PI * 2, true);
      ctx.clip('evenodd');
      ctx.drawImage(S.cover, L.bx, L.by, L.bw, L.bh);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(L.bx + L.bw / 2, L.by + L.bh / 2, t * L.bw * 0.75, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,220,140,' + (1 - t) + ')';
      ctx.save();
      ctx.beginPath();
      ctx.rect(L.bx, L.by, L.bw, L.bh);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(L.bx + L.bw / 2, L.by + L.bh / 2, t * L.bw * 0.75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  } else {
    ctx.drawImage(S.cover, L.bx, L.by, L.bw, L.bh);
  }
}

function drawBelt() {
  const L = S.L;
  const g = S.g;
  const x0 = L.bx - L.o * L.cs;
  const y0 = L.by - L.o * L.cs;
  const bw = L.bw + 2 * L.o * L.cs;
  const bh = L.bh + 2 * L.o * L.cs;
  const r0 = L.o * L.cs;
  const band = L.cartR * 2 + 2;
  rr(x0, y0, bw, bh, r0);
  ctx.lineWidth = band + 4;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.lineWidth = band;
  ctx.strokeStyle = '#2f242c';
  ctx.stroke();
  // 履带纹：跟着传送带一起走
  ctx.save();
  ctx.setLineDash([3, L.cs * 1.4]);
  ctx.lineDashOffset = -S.time * core.CFG.speed * L.cs;
  ctx.lineWidth = band - 8;
  ctx.strokeStyle = '#3d3038';
  ctx.stroke();
  ctx.restore();
  for (const d of [band / 2, -band / 2]) {
    rr(x0 - d, y0 - d, bw + 2 * d, bh + 2 * d, Math.max(2, r0 + d));
    ctx.lineWidth = 3;
    ctx.strokeStyle = BRASS;
    ctx.stroke();
  }
  // 入口：小灯 = 传送带上已经有几台
  const cap = core.CFG.beltCap;
  const ey = L.by + L.bh + L.o * L.cs + band / 2 + 13;
  for (let i = 0; i < cap; i++) {
    const on = i < core.onBelt(g);
    circle(W / 2 + (i - (cap - 1) / 2) * 15, ey, 5);
    ctx.fillStyle = on ? (S.beltFlash > 0 && Math.floor(S.time * 12) % 2 ? '#ff6b6b' : '#ffcf6b') : '#3a2c33';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = INK;
    ctx.stroke();
  }
  // 传送带上的连弩
  for (const sh of g.belt) {
    const p = beltXY(sh.s);
    sh.lastXY = p;
    let x = p.x;
    let y = p.y;
    if (sh.from && sh.flyT < 0.16) {
      const t = ease(sh.flyT / 0.16);
      x = lerp(sh.from.x, x, t);
      y = lerp(sh.from.y, y, t);
    }
    drawShooter(x, y, L.cartR, sh, p.ang);
  }
  for (let i = 0; i < g.entering.length; i++) {
    const sh = g.entering[i];
    const p = beltXY(0);
    const t = sh.from ? ease((sh.flyT || 0) / 0.16) : 1;
    drawShooter(lerp(sh.from ? sh.from.x : p.x, p.x - 4 * i, t), lerp(sh.from ? sh.from.y : p.y, p.y + 6 * i, t), L.cartR, sh, -Math.PI / 2, 0.85);
  }
}

function drawSlots() {
  const L = S.L;
  const g = S.g;
  const n = g.slots.length;
  const free = core.freeSlots(g);
  const danger = (free <= 1 && g.status === 'play') || g.status === 'full';
  for (let i = 0; i < n; i++) {
    const p = slotPos(i, n);
    rr(p.x - L.slotR - 4, p.y - L.slotR - 4, L.slotR * 2 + 8, L.slotR * 2 + 8, 10);
    ctx.fillStyle = '#1a1217';
    ctx.fill();
    ctx.lineWidth = 3;
    const blink = danger && Math.floor(S.time * 6) % 2 === 0;
    ctx.strokeStyle = blink && !g.slots[i] ? '#ff5a5a' : danger ? '#b84a3a' : BRASS_D;
    ctx.stroke();
    if (S.slotFlash > 0 && !g.slots[i]) {
      ctx.fillStyle = 'rgba(255,80,80,' + S.slotFlash * 0.4 + ')';
      ctx.fill();
    }
  }
  for (let i = 0; i < n; i++) {
    const sh = g.slots[i];
    if (!sh) continue;
    const p = slotPos(i, n);
    let x = p.x;
    let y = p.y;
    if (sh.from && sh.flyT < 0.2) {
      const t = ease(sh.flyT / 0.2);
      x = lerp(sh.from.x, x, t);
      y = lerp(sh.from.y, y, t);
    }
    drawShooter(x, y, L.slotR * 0.92, sh);
  }
  // 合体时飞过去的两台
  for (const gh of S.ghosts) {
    const t = ease(gh.t / gh.dur);
    drawShooter(lerp(gh.x0, gh.x1, t), lerp(gh.y0, gh.y1, t), L.slotR * 0.9 * (1 - t * 0.5), { color: gh.color, ammo: '', big: 0 }, undefined, 1 - t * 0.5);
  }
  // 槽满了：多出来的那台悬在上面发抖
  if (g.status === 'full' && g.overflow) {
    const p = slotPos(n - 1, n);
    const sx = Math.sin(S.time * 50) * 3;
    drawShooter(p.x + L.slotR * 2.3 + sx, p.y, L.slotR * 0.92, g.overflow);

function drawHand(x, y, press) {

function drawFx() {

  if (S.g.status === 'win') drawWinPanel();

    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fill();
    text(S.toast.text, W / 2, H * 0.42 + 21, 15, '#fff');

// —— 点按 ——
function onTouch(type, id, x, y) {
  if (type !== 'down') return;

    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      b.fn();

let last = P.now();

  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt);
  runTimers();
  render();
  P.nextFrame(frame);

frame();

P.exposeForTest('__cjg', {

  save,
  core,
  LV,
  W,
  H,
  startLevel,
  retry,
  nextLevel,
  tapCol: (i) => core.tapColumn(S.g, i),
  tapSlot: (i) => core.tapSlot(S.g, i),
  slotPos,
  colX,
  colItemY,

});
