const CAPTIONS = ['后坊亮着灯', '水银会流', '流水线上的铜雀', '飞去城墙', '长龙到了城下', '铜雀来了', '天亮了', '很久以前'];

function line(ctx, w) {
  ctx.lineWidth = w;
  ctx.strokeStyle = C.ink;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
}

function sky(ctx, S, top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
}

function stars(ctx, S, n, seed) {
  let s = seed;
  const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  ctx.fillStyle = '#fff6d8';
  for (let i = 0; i < n; i++) {
    const x = r() * S;
    const y = r() * S * 0.5;
    const z = r() < 0.2 ? 2 : 1;
    ctx.globalAlpha = 0.4 + r() * 0.6;
    ctx.fillRect(x, y, z * S / 200, z * S / 200);
  }
  ctx.globalAlpha = 1;
}

function gear(ctx, cx, cy, r, teeth, fill, rot, lw) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot || 0);
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a = (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 === 0 ? r : r * 0.8;
    const a2 = a + Math.PI / teeth;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    ctx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  line(ctx, lw);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = C.ink;
  ctx.fill();
  ctx.restore();
}

function puff(ctx, x, y, r, a) {
  ctx.globalAlpha = a === undefined ? 0.85 : a;
  ctx.fillStyle = C.steam;
  for (const [dx, dy, k] of [[0, 0, 1], [r * 0.8, r * 0.2, 0.75], [-r * 0.8, r * 0.25, 0.7], [r * 0.3, -r * 0.5, 0.7]]) {
    ctx.beginPath();
    ctx.arc(x + dx, y + dy, r * k, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 汐娘：护目镜推在额头上、发髻插一根铜簪、卷起袖子、工具带。s = 身高
function xiniang(ctx, x, y, s, pose) {
  const u = s / 10;
  const lw = Math.max(1.5, u * 0.35);
  ctx.save();
  ctx.translate(x, y);
  // 腿 / 裤
  ctx.fillStyle = C.jacketD;
  ctx.beginPath();
  ctx.moveTo(-1.6 * u, 0);
  ctx.lineTo(-1.2 * u, -3.2 * u);
  ctx.lineTo(1.2 * u, -3.2 * u);
  ctx.lineTo(1.6 * u, 0);
  ctx.closePath();
  ctx.fill();
  line(ctx, lw);
  ctx.stroke();
  // 身子（短上衣）
  ctx.fillStyle = C.jacket;
  ctx.beginPath();
  ctx.moveTo(-1.7 * u, -3 * u);
  ctx.lineTo(-1.4 * u, -6.4 * u);
  ctx.lineTo(1.4 * u, -6.4 * u);
  ctx.lineTo(1.7 * u, -3 * u);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // 工具带
  ctx.fillStyle = C.apron;
  ctx.fillRect(-1.75 * u, -3.6 * u, 3.5 * u, 0.7 * u);
  ctx.strokeRect(-1.75 * u, -3.6 * u, 3.5 * u, 0.7 * u);
  ctx.fillStyle = C.brass;
  ctx.fillRect(-0.3 * u, -3.55 * u, 0.6 * u, 0.6 * u);
  ctx.fillRect(0.9 * u, -3.4 * u, 0.4 * u, 1.1 * u); // 挂着的扳手
  // 手臂（卷袖子：前臂露出皮肤）
  const arm = (sx, raise) => {
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = u * 0.95;
    ctx.beginPath();
    ctx.moveTo(sx * 1.4 * u, -6 * u);
    const ex = sx * (raise ? 2.2 : 1.9) * u;
    const ey = raise ? -7.4 * u : -4.4 * u;
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.strokeStyle = C.jacket;
    ctx.lineWidth = u * 0.6;
    ctx.stroke();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = u * 0.8;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    const hx = sx * (raise ? 2.6 : 2.0) * u;
    const hy = raise ? -8.8 * u : -3.2 * u;
    ctx.lineTo(hx, hy);
    ctx.stroke();
    ctx.strokeStyle = C.skin;
    ctx.lineWidth = u * 0.45;
    ctx.stroke();
    return [hx, hy];
  };
  arm(-1, false);
  const hand = arm(1, pose === 'work');
  if (pose === 'work') {
    // 手里一颗水银珠
    ctx.fillStyle = C.mercury;
    ctx.beginPath();
    ctx.arc(hand[0], hand[1] - 0.6 * u, 0.6 * u, 0, Math.PI * 2);
    ctx.fill();
    line(ctx, lw * 0.7);
    ctx.stroke();
  }
  // 头
  ctx.fillStyle = C.skin;
  ctx.beginPath();
  ctx.arc(0, -7.6 * u, 1.25 * u, 0, Math.PI * 2);
  ctx.fill();
  line(ctx, lw);
  ctx.stroke();
  // 头发 + 发髻 + 铜簪
  ctx.fillStyle = C.hair;
  ctx.beginPath();
  ctx.arc(0, -7.9 * u, 1.3 * u, Math.PI * 1.02, Math.PI * 1.98);
  ctx.lineTo(1.25 * u, -7.4 * u);
  ctx.lineTo(-1.25 * u, -7.4 * u);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0.6 * u, -9.2 * u, 0.7 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = C.brass;
  ctx.lineWidth = u * 0.22;
  ctx.beginPath();
  ctx.moveTo(-0.3 * u, -9.9 * u);
  ctx.lineTo(1.6 * u, -8.7 * u);
  ctx.stroke();
  // 护目镜（推在额头）
  for (const gx of [-0.55, 0.55]) {
    ctx.fillStyle = C.brass;
    ctx.beginPath();
    ctx.arc(gx * 0.85 * u, -9.0 * u, 0.4 * u, 0, Math.PI * 2);
    ctx.fill();
    line(ctx, lw * 0.6);
    ctx.stroke();
    ctx.fillStyle = C.mercury;
    ctx.beginPath();
    ctx.arc(gx * 0.85 * u, -9.0 * u, 0.22 * u, 0, Math.PI * 2);
    ctx.fill();
  }
  // 眼睛
  ctx.fillStyle = C.ink;
  ctx.fillRect(-0.62 * u, -7.7 * u, 0.28 * u, 0.42 * u);
  ctx.fillRect(0.34 * u, -7.7 * u, 0.28 * u, 0.42 * u);
  ctx.fillStyle = '#e88a8a';
  ctx.fillRect(-0.9 * u, -7.15 * u, 0.35 * u, 0.18 * u);
  ctx.fillRect(0.55 * u, -7.15 * u, 0.35 * u, 0.18 * u);
  ctx.restore();
}

// 阿铸：宽肩、扛铜锤
function azhu(ctx, x, y, s) {
  const u = s / 10;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#5a3a2a';
  ctx.beginPath();
  ctx.moveTo(-2.4 * u, 0);
  ctx.lineTo(-2.8 * u, -6.5 * u);
  ctx.lineTo(2.8 * u, -6.5 * u);
  ctx.lineTo(2.4 * u, 0);
  ctx.closePath();
  ctx.fill();
  line(ctx, Math.max(1.5, u * 0.35));
  ctx.stroke();
  ctx.fillStyle = C.skin;
  ctx.beginPath();
  ctx.arc(0, -7.8 * u, 1.4 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = C.hair;
  ctx.fillRect(-1.4 * u, -9.3 * u, 2.8 * u, 0.9 * u);
  // 铜锤
  ctx.strokeStyle = C.woodD;
  ctx.lineWidth = u * 0.5;
  ctx.beginPath();
  ctx.moveTo(2.2 * u, -5 * u);
  ctx.lineTo(3.8 * u, -10 * u);
  ctx.stroke();
  ctx.fillStyle = C.copper;
  ctx.fillRect(2.6 * u, -11.6 * u, 2.6 * u, 1.8 * u);
  line(ctx, Math.max(1.5, u * 0.35));
  ctx.strokeRect(2.6 * u, -11.6 * u, 2.6 * u, 1.8 * u);
  ctx.restore();
}

// 铜雀：黄铜小鸟，齿轮翅膀
function bird(ctx, x, y, s, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  const u = s / 10;
  ctx.fillStyle = C.brass;
  ctx.beginPath();
  ctx.ellipse(0, 0, 4 * u, 2.4 * u, 0, 0, Math.PI * 2);
  ctx.fill();
  line(ctx, Math.max(1.2, u * 0.4));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4 * u, -0.5 * u);
  ctx.lineTo(6 * u, 0.2 * u);
  ctx.lineTo(4 * u, 0.9 * u);
  ctx.fillStyle = C.copper;
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-3.6 * u, 0);
  ctx.lineTo(-6.5 * u, -1.6 * u);
  ctx.lineTo(-6 * u, 1 * u);
  ctx.closePath();
  ctx.fillStyle = C.brassD;
  ctx.fill();
  ctx.stroke();
  gear(ctx, -0.5 * u, -1.8 * u, 2.6 * u, 8, C.brassL, 0.3, Math.max(1, u * 0.3));
  ctx.fillStyle = C.mercury;
  ctx.beginPath();
  ctx.arc(2.4 * u, -0.5 * u, 0.6 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function wall(ctx, S, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, y, S, S - y);
  const m = S / 12;
  for (let x = 0; x < S; x += m * 2) ctx.fillRect(x, y - m * 0.6, m, m * 0.6);
  line(ctx, S / 160);
  ctx.beginPath();
  ctx.moveTo(0, y);
  for (let x = 0; x < S; x += m * 2) {
    ctx.lineTo(x, y);
    ctx.lineTo(x, y - m * 0.6);
    ctx.lineTo(x + m, y - m * 0.6);
    ctx.lineTo(x + m, y);
  }
  ctx.lineTo(S, y);
  ctx.stroke();
}

function dragon(ctx, S, x, y, k, glow) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  ctx.fillStyle = '#2b2a36';
  ctx.beginPath();
  ctx.moveTo(-S * 0.5, S * 0.1);
  ctx.quadraticCurveTo(-S * 0.2, -S * 0.25, S * 0.1, -S * 0.2);
  ctx.lineTo(S * 0.35, -S * 0.32);
  ctx.lineTo(S * 0.3, -S * 0.18);
  ctx.lineTo(S * 0.45, -S * 0.1);
  ctx.lineTo(S * 0.2, -S * 0.02);
  ctx.quadraticCurveTo(-S * 0.1, S * 0.05, -S * 0.5, S * 0.3);
  ctx.closePath();
  ctx.fill();
  line(ctx, S / 120);
  ctx.stroke();
  for (let i = 0; i < 5; i++) gear(ctx, -S * 0.35 + i * S * 0.08, S * 0.05 - i * S * 0.04, S * 0.03, 6, '#4a4656', i, S / 200);
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(S * 0.22, -S * 0.17, S * 0.025, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

        fx.push({ kind: 'gear', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, t: clock, life: 1, s: 5 + Math.random() * 7, a: Math.random() * 6 });
      }
    }
    if (ev.clearBoard) {
      texts.push({ s: '清空', x: W / 2, y: L.by + L.board * 0.7, t: clock + 0.2, size: 64, col: COL.jade, big: true, word: true });
      setTimeout(() => P.sound('album', 0.6), 200);
      flash = 0.5;
    }
  }
  if (ev.comboEnd >= 2) {
    // 连击断了：火被蒸汽浇灭
    for (let n = 0; n < 18; n++) {
      const q = perimeter(Math.random());
      fx.push({ kind: 'steam', x: q.x, y: q.y, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 40, t: clock, life: 0.9, s: 10 + Math.random() * 10 });
    }
  }
  if (ev.shined.length || ev.picDone) {
    save.shine = g.shine.slice();
    save.pic = g.pic;
    persist();
  }
  if (ev.picDone) {
    picEvent = { t: clock + 0.45, idx: ev.picIdx };
    save.coins += C.coinPerPicture;
    persist();
    setTimeout(() => P.sound('album', 0.8), 450);
  }
  if (ev.stuck) {
    mode = 'dying';
    dyingAt = clock;
    stats.overs.push(P.now());
    setTimeout(() => P.sound('lose', 0.6), 200);

}
// 边框上的一点（t: 0..1 绕一圈）
function perimeter(t) {
  const B = L.board + 16, x0 = L.bx - 8, y0 = L.by - 8;
  const d = t * 4;
  if (d < 1) return { x: x0 + d * B, y: y0 };
  if (d < 2) return { x: x0 + B, y: y0 + (d - 1) * B };
  if (d < 3) return { x: x0 + B - (d - 2) * B, y: y0 + B };
  return { x: x0, y: y0 + B - (d - 3) * B };
}

// ---------- 一局结束 ----------
function endGame() {
  overAt = clock;
  drag = null;
  const newBest = g.score > save.best;
  const coins = Math.floor(g.score * C.coinPerScore);
  save.best = Math.max(save.best, g.score);
  save.coins += coins;
  persist();
  result = { score: g.score, best: save.best, newBest, coins: coins + g.picsDone * C.coinPerPicture, pics: g.picsDone };
  mode = 'over';
}
function continueAfterAd(fn) {
  ad = { until: clock + C.adSec, done: fn, lastTick: -1 };
  mode = 'ad';
}

// ---------- 更新 ----------
function update(dt) {
  if (mode === 'ad') {
    clock += dt;
    const s = Math.ceil(ad.until - clock);
    if (s !== ad.lastTick) { ad.lastTick = s; if (s > 0) P.sound('tick', 0.4); }
    if (clock >= ad.until) { const f = ad.done; ad = null; f(); }
    return;
  }
  if (P.now() < stopUntil) return; // 顿帧：画面时钟停一下
  clock += dt;
  if (mode === 'dying' && clock - dyingAt > 0.75) endGame();
  if (g && g.deals !== lastDeals) {
    lastDeals = g.deals;
    slotIn = [clock + 0.05, clock + 0.11, clock + 0.17];
  }
  // 边框的火：跟着连击数长
  const want = g && g.combo >= 2 && mode === 'play' ? Math.min(1, (g.combo - 1) / 7) : 0;
  fireLv += (want - fireLv) * Math.min(1, dt * 6);
  if (fireLv > 0.03) {
    const rate = 30 + fireLv * 120;
    let n = rate * dt;
    while (n > 0) {
      if (Math.random() < n) {
        const q = perimeter(Math.random());
        fx.push({ kind: 'flame', x: q.x + (Math.random() - 0.5) * 6, y: q.y, vx: (Math.random() - 0.5) * 20, vy: -50 - Math.random() * 70 * (0.5 + fireLv), t: clock, life: 0.35 + Math.random() * 0.35 * (0.6 + fireLv), s: 5 + Math.random() * 7 * (0.6 + fireLv) });
      }
      n -= 1;
    }
  }
  // 蒸汽：管子接头偶尔喷一口
  if (Math.random() < dt * 0.8) {
    const left = Math.random() < 0.5;
    const y = 60 + 150 * Math.floor(Math.random() * Math.max(1, (H - 60) / 150)) + 6;
    fx.push({ kind: 'steam', x: left ? 16 : W - 16, y, vx: left ? 30 : -30, vy: -14, t: clock, life: 1.2, s: 9, bg: true });
  }
  // 崩开的格：到点就炸成碎片
  clearing.forEach((cl) => {
    if (cl.done || clock < cl.t0) return;
    cl.done = true;
    const x = cellX(cl.k % N) + L.cell / 2, y = cellY(Math.floor(cl.k / N)) + L.cell / 2;
    const pal = PALETTE[cl.color - 1];
    for (let n = 0; n < 4 + Math.min(4, cl.lv >> 1); n++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * (120 + cl.lv * 25);
      fx.push({ kind: 'shard', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140, t: clock, life: 0.55 + Math.random() * 0.3, s: L.cell * (0.14 + Math.random() * 0.14), a: Math.random() * 6, va: (Math.random() - 0.5) * 16, col: Math.random() < 0.5 ? pal[0] : pal[1] });
    }
    fx.push({ kind: 'spark', x, y, t: clock, life: 0.25, s: L.cell * 0.9 });
  });
  fx.forEach((f) => {
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.kind === 'shard' || f.kind === 'gear') f.vy += 900 * dt;
    if (f.kind === 'steam') f.vy -= 8 * dt;
    if (f.a !== undefined) f.a += (f.va || 8) * dt;
  });
  fx = fx.filter((f) => clock - f.t < f.life);
  texts = texts.filter((t) => clock - t.t < (t.big ? 1.15 : 0.8));
  clearing = clearing.filter((c) => clock - c.t0 < 0.2);
  sweeps = sweeps.filter((s) => clock - s.t < 0.45);
  popping = popping.filter((c) => clock - c.t < 0.16);
  shineAnim = shineAnim.filter((c) => clock - c.t < 0.6);
  if (picEvent && clock - picEvent.t > 2.2) picEvent = null;
  shake *= Math.pow(0.0015, dt);
  if (shake < 0.3) shake = 0;
  flash = Math.max(0, flash - dt * 1.8);
  if (g) displayScore += (g.score - displayScore) * Math.min(1, dt * 12);
}

function drawBoard(showGhost) {
  const { bx, by, cell, board: B } = L;
  const pad = 13;
  // 连击时边框烧起来：先画一圈发光
  if (fireLv > 0.03) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let n = 0; n < 3; n++) {
      const a = fireLv * (0.35 - n * 0.09) * (0.85 + Math.sin(clock * 14 + n) * 0.15);
      ctx.strokeStyle = 'rgba(255,' + (120 + n * 40) + ',40,' + a + ')';
      ctx.lineWidth = 10 + n * 10 + fireLv * 10;
      rr(bx - pad - 2, by - pad - 2, B + pad * 2 + 4, B + pad * 2 + 4, 18); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.drawImage(frameCanvas, bx - pad - 4, by - pad - 4, frameCanvas.width / dpr, frameCanvas.height / dpr);
  // 底下的画：空格里看得见；擦亮几级就多亮
  const pc = painting(g.pic);
  const ps = pc.width / N;
  // 拖的时候：落点、会清掉的线
  let ghost = null, willUnits = [];
  if (showGhost && drag && g.hand[drag.slot]) {
    const h = g.hand[drag.slot];
    const s = snap(h.p, drag.x, drag.y);
    if (s) { ghost = { h, s }; willUnits = previewUnits(h.p, s.r, s.c); }
  }
  const willSet = new Set();
  willUnits.forEach((u) => core.UNITS[u].forEach((k) => willSet.add(k)));
  for (let k = 0; k < N * N; k++) {
    const r = Math.floor(k / N), c = k % N, x = cellX(c), y = cellY(r);
    ctx.drawImage(pc, c * ps, r * ps, ps, ps, x, y, cell, cell);
    const sh = SHADE[Math.min(SHADE.length - 1, g.shine[k])];
    if (sh) { ctx.fillStyle = 'rgba(26,14,8,' + sh + ')'; ctx.fillRect(x, y, cell, cell); }
  }
  // 格线：凹进去的槽
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < N; i++) {
    ctx.moveTo(bx + i * cell + 0.5, by); ctx.lineTo(bx + i * cell + 0.5, by + B);
    ctx.moveTo(bx, by + i * cell + 0.5); ctx.lineTo(bx + B, by + i * cell + 0.5);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,160,0.07)';
  ctx.beginPath();
  for (let i = 1; i < N; i++) {
    ctx.moveTo(bx + i * cell + 1.5, by); ctx.lineTo(bx + i * cell + 1.5, by + B);
    ctx.moveTo(bx, by + i * cell + 1.5); ctx.lineTo(bx + B, by + i * cell + 1.5);
  }
  ctx.stroke();
  // 刚擦亮的格：金光一闪
  shineAnim.forEach((s) => {
    const a = (clock - s.t) / 0.6;
    if (a < 0) return;
    ctx.fillStyle = 'rgba(255,226,140,' + Math.max(0, 0.75 - a) + ')';
    ctx.fillRect(cellX(s.k % N), cellY(Math.floor(s.k / N)), cell, cell);
  });
  // 会被清掉的线：整条提前发光
  if (willUnits.length) {
    const a = 0.28 + Math.sin(clock * 12) * 0.1;
    willUnits.forEach((u) => {
      const row = u < N, i = row ? u : u - N;
      const x = row ? bx : cellX(i), y = row ? cellY(i) : by, w = row ? B : cell, hh = row ? cell : B;
      ctx.fillStyle = 'rgba(255,236,170,' + a + ')';
      ctx.fillRect(x, y, w, hh);
    });
  }
  // 块
  const dying = mode === 'dying' || mode === 'over' || (mode === 'ad' && result);
  const grayRow = mode === 'dying' ? Math.floor((clock - dyingAt) / 0.06) : N;
  for (let k = 0; k < N * N; k++) {
    const ci = g.board[k];
    if (!ci) continue;
    const pop = popping.find((p) => p.k === k);
    const sc = pop ? 1 + 0.16 * Math.sin(((clock - pop.t) / 0.16) * Math.PI) : 1;
    const s = cell * sc, x = cellX(k % N) + (cell - s) / 2, y = cellY(Math.floor(k / N)) + (cell - s) / 2;
    // 会被清掉的块：换成手里那块的颜色（Block Blast 的提示）
    const col = willSet.has(k) ? ghost.h.color : dying && Math.floor(k / N) < grayRow ? GRAY : ci;
    block(col, x, y, s);
    if (willSet.has(k)) { ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + Math.sin(clock * 12) * 0.1) + ')'; rr(x + 2, y + 2, s - 4, s - 4, 6); ctx.fill(); }
  }
  if (ghost) {
    ghost.h.p.cells.forEach(([dr, dc]) => block(ghost.h.color, cellX(ghost.s.c + dc), cellY(ghost.s.r + dr), cell, 0.42));
  }
  // 要清的线：外面再描一圈亮边
  if (willUnits.length) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    willUnits.forEach((u) => {
      const row = u < N, i = row ? u : u - N;
      const x = row ? bx : cellX(i), y = row ? cellY(i) : by, w = row ? B : cell, hh = row ? cell : B;
      ctx.strokeStyle = 'rgba(255,230,140,' + (0.55 + Math.sin(clock * 12) * 0.25) + ')';
      ctx.lineWidth = 3;
      rr(x + 1.5, y + 1.5, w - 3, hh - 3, 8); ctx.stroke();
    });
    ctx.restore();
  }
  // 还没崩的格：被光扫到前先亮着；崩的那一下变白放大
  clearing.forEach((cl) => {
    const x = cellX(cl.k % N), y = cellY(Math.floor(cl.k / N));
    const a = (clock - cl.t0) / 0.2;
    if (a < 0) {
      block(cl.color, x, y, cell);
      ctx.fillStyle = 'rgba(255,250,220,0.35)'; rr(x + 1, y + 1, cell - 2, cell - 2, 6); ctx.fill();
      return;
    }
    const s = cell * (1 + a * 0.35);
    ctx.globalAlpha = Math.max(0, 1 - a);
    block(cl.color, x + (cell - s) / 2, y + (cell - s) / 2, s);
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.9 - a) + ')';
    rr(x + (cell - s) / 2, y + (cell - s) / 2, s, s, 8); ctx.fill();
    ctx.globalAlpha = 1;
  });
  // 扫过去的光
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  sweeps.forEach((sw) => {
    const a = (clock - sw.t) / 0.26;
    if (a < 0) return;
    const row = sw.u < N, i = row ? sw.u : sw.u - N;
    const fade = a > 1 ? Math.max(0, 1 - (a - 1) * 1.4) : 1;
    const head = Math.min(1, a) * (B + cell) - cell * 0.5;
    const trail = B * 0.55;
    let gr;
    if (row) {
      const y = cellY(i);
      gr = ctx.createLinearGradient(bx + head - trail, 0, bx + head, 0);
      gr.addColorStop(0, 'rgba(255,220,140,0)');
      gr.addColorStop(1, 'rgba(255,248,220,' + 0.9 * fade + ')');
      ctx.fillStyle = gr;
      ctx.fillRect(Math.max(bx - 6, bx + head - trail), y - 3, Math.min(trail, head + 6), cell + 6);
      ctx.fillStyle = 'rgba(255,255,255,' + fade + ')';
      ctx.beginPath(); ctx.ellipse(bx + head, y + cell / 2, cell * 0.35, cell * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      const x = cellX(i);
      gr = ctx.createLinearGradient(0, by + head - trail, 0, by + head);
      gr.addColorStop(0, 'rgba(255,220,140,0)');
      gr.addColorStop(1, 'rgba(255,248,220,' + 0.9 * fade + ')');
      ctx.fillStyle = gr;
      ctx.fillRect(x - 3, Math.max(by - 6, by + head - trail), cell + 6, Math.min(trail, head + 6));
      ctx.fillStyle = 'rgba(255,255,255,' + fade + ')';
      ctx.beginPath(); ctx.ellipse(x + cell / 2, by + head, cell * 0.8, cell * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
  });
  ctx.restore();
  // 一张画整张擦亮：整张亮出来一下
  if (picEvent && clock >= picEvent.t) {
    const a = (clock - picEvent.t) / 2.2;
    ctx.globalAlpha = a < 0.15 ? a / 0.15 : Math.max(0, 1 - (a - 0.6) / 0.4);
    ctx.drawImage(painting(picEvent.idx), bx, by, B, B);
    ctx.globalAlpha = 1;
  }
}
