<script>

__def("js/core.js", function (module, exports, require) {
// 玩法核心：只有格子、连弩、传送带、槽位，不画图。
// 手机里、浏览器里、node 机器人里跑的都是这一份。画面层只读 g 和 g.events。
//
// 2026-11-20 C 版改成「Pixel Flow 照做版」（拆解见 传送带消除/拆解_PixelFlow_前10关_20261120.md）：
//   - 连弩每经过一列 / 一行只打一发：打这条线最外面那格，同色才打（原作就是这样）
//   - 等待槽 5 格、传送带同时 5 台，前 20 关都不变；传送带一圈 6 秒（按图大小算速度）
//   - 弹药只有 10/20/30/40：出关时把每种颜色的格子数修成整十（只动边上几格），每色弹药加起来 = 格子数
//   - 不合体、一关一张图（玩具版的热身图、合体先关掉，等照做版好玩了再当「改」的一步加回来）
// 下面是玩具版留下的说明（规则已按上面改）：
//   - 连弩经过一列 / 一行，把这条线上从外往里「连着的同色」一口气全吃掉（原型：一发）
//   - 合体大连弩会穿透：这条线上所有同色都吃，挡在中间的别的颜色不管
//   - 传送带同时 5 台、速度 18 格/秒（16×16 的图绕一圈 4.2 秒）
//   - 一关两张图：先一件小东西热身，清完「叮」一下，再来主图（清完插画刷开）。
//     每张图的连弩子弹加起来正好等于格子数，所以一张图清完时传送带、机关匣、下面几列都刚好空了

const CFG = {
  drop1: 0.25, // 攻防组装：一种颜色打掉几成掉第一个零件
  drop2: 0.6, // 打掉几成掉第二个
  lapSec: 6, // 照做版：传送带一圈几秒（原作约 6 秒）。速度 = 一圈格数 / lapSec
  perLane: 1, // 照做版：每条线打几发（原作 1 发）
  speed: 18, // 传送带速度：格 / 秒（16×16 的图一圈 76 格，绕一圈约 4.2 秒）
  corner: 3, // 拐角算几格长
  pierce: true, // 合体大连弩：穿透别的颜色，这条线上的同色全吃
  beltCap: 5, // 传送带上最多几台（原作 5 台）
  gap: 2, // 两台连弩在传送带上至少隔几格
  stagePause: 0.8, // 一张图清完到下一张掉下来，停多久（秒，给「叮」的特效留时间）
  merge: false, // 槽里同色三台合体（照做版关掉）
  rescue: false, // 槽满时刚好凑成三台也算救回来
};

// —— 攻防组装（2026-11-20 Cc 定：要有「胡不胡」，学《赵云与阿斗》格子有限）——
// 敌方机关兽某种颜色打掉一半、打光，各掉一个零件，落进和连弩车同一排的槽里（占格子）。
// 槽里凑齐一张图纸就当场合体出机关；凑不齐就一直占着格子（槽满就输）；不要的点一下扔掉。
const PARTS = ['head', 'wing', 'arm', 'gear']; // 铜头 木翅 弩臂 齿轮
const RECIPES = {
  que: ['head', 'wing', 'wing'], // 铜雀：飞出去吃掉场上剩得最多的那种颜色
  spin: ['arm', 'arm', 'gear'], // 转射机：上传送带转一圈，什么颜色都打（最外层，一列一发）
  kite: ['wing', 'gear', 'gear'], // 木鸢：这一关多一个槽
};
const SPIN_AMMO = 24;

// 颜色：字母 → 序号。关卡图里用字母画。
const ORDER = 'ROYGTBPKNWDS'; // 后四个是玩具版加的：N 棕（木头）W 白（蒸汽）D 深（眼睛头发）S 肤色

function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// scale = 每个字母画成几乘几的小格（玩具版一律 1：格子大、看得清）
function parseArt(art, scale) {
  const z = scale || 1;
  const rows = art.map((r) => r.trim());
  const h0 = rows.length;
  const w0 = rows[0].length;
  const w = w0 * z;
  const h = h0 * z;
  const cells = new Int8Array(w * h).fill(-1);
  for (let y = 0; y < h0; y++) {
    if (rows[y].length !== w0) throw new Error('关卡图第 ' + (y + 1) + ' 行长度不对');
    for (let x = 0; x < w0; x++) {
      const k = ORDER.indexOf(rows[y][x]);
      if (k < 0) continue;
      for (let dy = 0; dy < z; dy++) for (let dx = 0; dx < z; dx++) cells[(y * z + dy) * w + x * z + dx] = k;
    }
  }
  return { w, h, cells };
}

// 每格「埋得多深」：四个方向里，挡在它前面最少有几格
function depthMap(cells, w, h) {
  const d = new Int16Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      if (cells[y * w + x] < 0) continue;
      let a = 0, b = 0, c = 0, e = 0;
      for (let k = y + 1; k < h; k++) if (cells[k * w + x] >= 0) a++;
      for (let k = y - 1; k >= 0; k--) if (cells[k * w + x] >= 0) b++;
      for (let k = x + 1; k < w; k++) if (cells[y * w + k] >= 0) c++;
      for (let k = x - 1; k >= 0; k--) if (cells[y * w + k] >= 0) e++;
      d[y * w + x] = Math.min(a, b, c, e);
    }
  return d;
}

// —— 传送带的形状：一圈圆角矩形，从左下角进，顺着「下 → 右 → 上 → 左」绕一圈 ——
function loopLen(w, h) {
  return 2 * w + 2 * h + 4 * CFG.corner;
}

// 第 s 格时正对着哪一条线（列或行），拐角处返回 null
function laneAt(s, w, h) {
  const C = CFG.corner;
  let t = s;
  if (t < C) return null;
  t -= C;
  if (t < w) return { dir: 0, k: Math.floor(t) }; // 下边，朝上打第 k 列
  t -= w;
  if (t < C) return null;
  t -= C;
  if (t < h) return { dir: 1, k: h - 1 - Math.floor(t) }; // 右边，朝左打第 k 行
  t -= h;
  if (t < C) return null;
  t -= C;
  if (t < w) return { dir: 2, k: w - 1 - Math.floor(t) }; // 上边，朝下
  t -= w;
  if (t < C) return null;
  t -= C;
  if (t < h) return { dir: 3, k: Math.floor(t) }; // 左边，朝右
  return null;
}

// 这条线上从外往里第一个还在的格子
function firstInLane(cells, w, h, dir, k) {
  if (dir === 0) {
    for (let y = h - 1; y >= 0; y--) if (cells[y * w + k] >= 0) return y * w + k;
  } else if (dir === 1) {
    for (let x = w - 1; x >= 0; x--) if (cells[k * w + x] >= 0) return k * w + x;
  } else if (dir === 2) {
    for (let y = 0; y < h; y++) if (cells[y * w + k] >= 0) return y * w + k;
  } else {
    for (let x = 0; x < w; x++) if (cells[k * w + x] >= 0) return k * w + x;
  }
  return -1;
}

// 这条线上这台连弩一口气能吃掉哪些格（从外往里排好）：
// 小连弩：最外面那格同色才开吃，连着的同色一直吃到碰见别的颜色 / 空了 / 子弹打完
// 大连弩（pierce）：这条线上所有同色都吃，中间隔着别的颜色也穿过去
function laneRun(cells, w, h, dir, k, color, max, pierce) {
  const out = [];
  const n = dir === 0 || dir === 2 ? h : w;
  for (let j = 0; j < n && out.length < max; j++) {
    let idx;
    if (dir === 0) idx = (h - 1 - j) * w + k;
    else if (dir === 1) idx = k * w + (w - 1 - j);
    else if (dir === 2) idx = j * w + k;
    else idx = k * w + j;
    const c = cells[idx];
    if (c < 0) continue; // 已经空了（或本来就空）的格子，子弹直接飞过去
    if (c === color) out.push(idx);
    else if (!pierce) break; // 小连弩碰见别的颜色就停；大连弩穿过去接着找
  }
  return out;
}

// 画面用：传送带上第 s 格在哪（单位是格，棋盘左上角是 0,0），o = 传送带离棋盘多远
function beltPos(s, w, h, o) {
  const L = loopLen(w, h);
  let t = ((s % L) + L) % L;
  const arc = (cx, cy, a0, a1, f) => {
    const a = a0 + (a1 - a0) * f;
    return { x: cx + o * Math.cos(a), y: cy + o * Math.sin(a), dir: null };
  };
  const P = Math.PI;
  const C = CFG.corner;
  if (t < C) return arc(0, h, P, P / 2, t / C);
  t -= C;
  if (t < w) return { x: t, y: h + o, dir: 0 };
  t -= w;
  if (t < C) return arc(w, h, P / 2, 0, t / C);
  t -= C;
  if (t < h) return { x: w + o, y: h - t, dir: 1 };
  t -= h;
  if (t < C) return arc(w, 0, 0, -P / 2, t / C);
  t -= C;
  if (t < w) return { x: w - t, y: -o, dir: 2 };
  t -= w;
  if (t < C) return arc(0, 0, -P / 2, -P, t / C);
  t -= C;
  return { x: -o, y: t, dir: 3 };
}

// —— 一局 ——
// level: { w, h, cells, cols: [[{color, ammo}]], slots, stages: [{ cells, cols }] }
//   stages 可以没有（就当只有一张图）；有的话按顺序一张张来
// opts: { extraSlots, dog（大连弩多转一圈）, turtle（槽满救一次） }
function cellCount(cells) {
  let n = 0;
  for (let i = 0; i < cells.length; i++) if (cells[i] >= 0) n++;
  return n;
}

// 换上第 k 张图：格子、每种颜色几格、下面几列的连弩
function loadStage(g, k) {
  const st = g.stages[k];
  g.stage = k;
  g.cells = new Int8Array(st.cells);
  g.counts = new Array(ORDER.length).fill(0);
  for (let i = 0; i < g.cells.length; i++) if (g.cells[i] >= 0) g.counts[g.cells[i]]++;
  g.stageLeft = cellCount(g.cells);
  g.cols = st.cols.map((c) => c.map((s) => ({ id: g.nextId++, color: s.color, ammo: s.ammo, big: 0 })));
  if (g.partsOn) assignParts(g);
}

// 每种颜色掉哪种零件：把几张图纸要的零件排成一串，按颜色发下去（固定种子，同一关每次一样）。
// ≥20 格的颜色掉两个（打掉一半一个、打光一个），10 格的掉一个。只亮这关凑得出来的图纸。
function assignParts(g) {
  const colors = [];
  g.counts.forEach((n, c) => n > 0 && colors.push(c));
  const r = rng(g.partSeed || 7);
  const order = ['que', 'spin', 'kite'].sort(() => r() - 0.5);
  const pool = [];
  for (const k of order) pool.push(...RECIPES[k]);
  // 一色掉两个同样的零件，所以按「两个一样」配对：先给需要成对的（翅、臂、齿轮），再给单个的
  g.partOf = {};
  g.drops = {};
  g.init = g.counts.slice();
  colors.sort((a, b) => g.counts[b] - g.counts[a]);
  const pairs = [];
  const singles = [];
  const need = {};
  for (const k of order) for (const p of RECIPES[k]) need[p] = (need[p] || 0) + 1;
  for (const p of PARTS) {
    let n = need[p] || 0;
    while (n >= 2) { pairs.push(p); n -= 2; }
    if (n) singles.push(p);
  }
  let pi = 0, si = 0;
  for (const c of colors) {
    const two = g.counts[c] >= 20;
    if (two && pi < pairs.length) g.partOf[c] = pairs[pi++];
    else if (si < singles.length) g.partOf[c] = singles[si++];
    else if (pi < pairs.length) g.partOf[c] = pairs[pi++];
    else g.partOf[c] = PARTS[Math.floor(r() * PARTS.length)];
    g.drops[c] = 0;
  }
  // 这关一共会掉哪些零件 → 只亮凑得出来的图纸（最多 3 张）
  const total = {};
  for (const c of colors) total[g.partOf[c]] = (total[g.partOf[c]] || 0) + (g.counts[c] >= 20 ? 2 : 1);
  g.recipes = Object.keys(RECIPES).filter((k) => {
    const want = {};
    for (const p of RECIPES[k]) want[p] = (want[p] || 0) + 1;
    return Object.keys(want).every((p) => (total[p] || 0) >= want[p]);
  });
  g.huCount = 0;
}

// 打掉格子后：看这种颜色该不该掉零件
function partCheck(g, color, idx) {
  if (!g.partsOn || g.partOf[color] === undefined) return;
  const n0 = g.init[color];
  const done = 1 - g.counts[color] / n0; // 这种颜色打掉了几成
  // 掉得早一点，胡了才有用：≥20 格的打掉 25% 掉第一个、60% 掉第二个；10 格的打掉一半掉一个
  const want = n0 >= 20 ? (done >= CFG.drop2 ? 2 : done >= CFG.drop1 ? 1 : 0) : done >= 0.5 ? 1 : 0;
  while (g.drops[color] < want) {
    g.drops[color]++;
    dropPart(g, g.partOf[color], idx);
  }
}

function dropPart(g, part, idx) {
  const free = g.slots.indexOf(null);
  if (free < 0) {
    // 槽满了：零件掉不进来，碎掉（零件本身不会让你输，输的是连弩车回不来）
    g.events.push({ type: 'partLost', part, idx });
    return;
  }
  const pc = { id: g.nextId++, part, color: -1, ammo: 0, big: 0 };
  g.slots[free] = pc;
  g.events.push({ type: 'part', at: free, part, idx, sh: pc });
  huCheck(g);
}

// 槽里凑齐一张图纸 → 合体
function huCheck(g) {
  for (const k of g.recipes || []) {
    const use = [];
    const ok = RECIPES[k].every((p) => {
      const i = g.slots.findIndex((s, j) => s && s.part === p && !use.includes(j));
      if (i < 0) return false;
      use.push(i);
      return true;
    });
    if (!ok) continue;
    for (const i of use) g.slots[i] = null;
    g.huCount++;
    g.events.push({ type: 'hu', recipe: k, from: use });
    // 机关的效果放到下一帧开头再做：这时候可能正在遍历传送带，当场改传送带会出错
    (g.pending || (g.pending = [])).push(k);
    return;
  }
}

function applyMachine(g, k) {
  {
    if (k === 'que') machineQue(g);
    else if (k === 'spin') {
      const sp = { id: g.nextId++, color: -2, ammo: SPIN_AMMO, big: 1, spin: true, s: 0, lane: -1, laneDone: false };
      g.belt.push(sp);
      g.events.push({ type: 'spinIn', sh: sp });
    } else if (k === 'kite') {
      g.slots.push(null);
      g.events.push({ type: 'kiteSlot', at: g.slots.length - 1 });
    }
  }
}

// 铜雀：吃掉场上剩得最多的那种颜色
function machineQue(g) {
  let best = -1;
  g.counts.forEach((n, c) => n > 0 && (best < 0 || n > g.counts[best]) && (best = c));
  if (best < 0) return;
  const idxs = [];
  for (let i = 0; i < g.cells.length; i++) if (g.cells[i] === best) idxs.push(i);
  for (const i of idxs) {
    g.cells[i] = -1;
    g.left--;
    g.stageLeft--;
  }
  g.counts[best] = 0;
  g.events.push({ type: 'zap', color: best, idxs });
  colorGone(g, best);
  if (g.left === 0) {
    g.status = 'win';
    g.events.push({ type: 'win' });
  }
}

// 一种颜色清光了：所有这种颜色的连弩车都没东西可打了，统统收掉（机关吃掉格子以后会出现这种情况）
function colorGone(g, c) {
  g.cols.forEach((col, i) => {
    g.cols[i] = col.filter((s) => s.color !== c);
  });
  g.slots.forEach((s, i) => s && s.color === c && !s.part && (g.slots[i] = null));
  for (const list of [g.belt, g.entering])
    for (let i = list.length - 1; i >= 0; i--)
      if (list[i].color === c) {
        g.events.push({ type: 'empty', sh: list[i] });
        list.splice(i, 1);
      }
}

function createGame(level, opts) {
  opts = opts || {};
  const stages = level.stages || [{ cells: level.cells, cols: level.cols }];
  let total = 0;
  for (const st of stages) total += cellCount(st.cells);
  const g = {
    w: level.w,
    h: level.h,
    L: loopLen(level.w, level.h),
    speed: CFG.lapSec ? loopLen(level.w, level.h) / CFG.lapSec : CFG.speed,
    stages,
    stage: 0,
    stageLeft: 0,
    pause: 0,
    nextId: 1,
    cells: null,
    counts: null,
    total,
    left: total,
    cols: null,
    belt: [],
    entering: [],
    slots: new Array(level.slots + (opts.extraSlots || 0)).fill(null),
    time: 0,
    status: 'play', // play / win / full
    overflow: null,
    adsUsed: 0,
    turtle: opts.turtle ? 1 : 0,
    dog: !!opts.dog,
    events: [],
    taps: 0,
    partsOn: !!level.parts,
    partSeed: level.partSeed || 7,
  };
  loadStage(g, 0);
  return g;
}

function onBelt(g) {
  return g.belt.length + g.entering.length;
}

function canLaunch(g) {
  return g.status === 'play' && g.pause <= 0 && onBelt(g) < CFG.beltCap;
}

function launch(g, s, from, i) {
  s.s = 0;
  s.lane = -1;
  s.laneDone = false;
  s.extra = false;
  g.entering.push(s);
  g.taps++;
  g.events.push({ type: 'launch', from, i, sh: s });
}

function tapColumn(g, i) {
  const c = g.cols[i];
  if (!c || !c.length) return false;
  if (!canLaunch(g)) {
    g.events.push({ type: 'beltFull' });
    return false;
  }
  launch(g, c.shift(), 'col', i);
  return true;
}

function tapSlot(g, i) {
  const s = g.slots[i];
  if (!s) return false;
  if (s.part) {
    // 不要的零件：扔进熔炉，格子空出来
    g.slots[i] = null;
    g.events.push({ type: 'scrap', at: i, part: s.part, sh: s });
    return true;
  }
  if (!canLaunch(g)) {
    g.events.push({ type: 'beltFull' });
    return false;
  }
  g.slots[i] = null;
  launch(g, s, 'slot', i);
  return true;
}

function freeSlots(g) {
  let n = 0;
  for (const s of g.slots) if (!s) n++;
  return n;
}

// 槽里同色三台 → 合成一台大连弩（我们改的三成之一）
function mergeCheck(g) {
  if (!CFG.merge) return;
  let merged = true;
  while (merged) {
    merged = false;
    for (let c = 0; c < ORDER.length && !merged; c++) {
      const idx = [];
      g.slots.forEach((s, i) => s && s.color === c && idx.push(i));
      if (idx.length >= 3) {
        const [a, b, d] = idx;
        const parts = [g.slots[a], g.slots[b], g.slots[d]];
        const big = { id: parts[0].id, color: c, ammo: parts[0].ammo + parts[1].ammo + parts[2].ammo, big: Math.min(3, 1 + Math.max(parts[0].big, parts[1].big, parts[2].big)) };
        g.slots[a] = big;
        g.slots[b] = null;
        g.slots[d] = null;
        g.events.push({ type: 'merge', at: a, from: [b, d], sh: big });
        merged = true;
      }
    }
  }
}

function backToSlot(g, s) {
  const free = g.slots.indexOf(null);
  if (free >= 0) {
    g.slots[free] = s;
    g.events.push({ type: 'toSlot', at: free, sh: s });
    mergeCheck(g);
    if (freeSlots(g) <= 1) g.events.push({ type: 'warn', free: freeSlots(g) });
    return;
  }
  // 满了：能和槽里两台同色凑成三台，就当场合体，不算输
  const same = [];
  g.slots.forEach((x, i) => x && x.color === s.color && same.push(i));
  if (CFG.merge && CFG.rescue && same.length >= 2) {
    const [a, b] = same;
    const big = { id: s.id, color: s.color, ammo: s.ammo + g.slots[a].ammo + g.slots[b].ammo, big: Math.min(3, 1 + Math.max(s.big, g.slots[a].big, g.slots[b].big)) };
    g.slots[a] = big;
    g.slots[b] = null;
    g.events.push({ type: 'merge', at: a, from: [b], sh: big, rescue: true });
    return;
  }
  if (g.turtle > 0) {
    g.turtle--;
    g.slots.push(s);
    g.events.push({ type: 'turtle', at: g.slots.length - 1, sh: s });
    return;
  }
  g.status = 'full';
  g.overflow = s;
  g.events.push({ type: 'full', sh: s });
}

// 看广告：机关匣加一格，接着打
function adContinue(g) {
  if (g.status !== 'full' || !g.overflow) return false;
  g.slots.push(g.overflow);
  g.events.push({ type: 'toSlot', at: g.slots.length - 1, sh: g.overflow, ad: true });
  g.overflow = null;
  g.status = 'play';
  g.adsUsed++;
  mergeCheck(g);
  return true;
}

function step(g, dt) {
  if (g.status !== 'play') return;
  g.time += dt;
  // 一张图刚清完：停一下，再把下一张图和下一批连弩换上来
  if (g.pause > 0) {
    g.pause -= dt;
    if (g.pause <= 0) {
      loadStage(g, g.stage + 1);
      g.events.push({ type: 'stageIn', stage: g.stage });
    }
    return;
  }
  // 上一帧凑齐的图纸、清光的颜色：在这里统一处理（不在遍历传送带时改它）
  while (g.gone && g.gone.length) colorGone(g, g.gone.shift());
  while (g.pending && g.pending.length) {
    applyMachine(g, g.pending.shift());
    if (g.status !== 'play') return;
  }
  // 排队的连弩：前面那台走开 gap 格才上
  if (g.entering.length) {
    let minS = Infinity;
    for (const b of g.belt) if (b.s < minS) minS = b.s;
    if (minS >= CFG.gap) g.belt.push(g.entering.shift());
  }
  for (let i = 0; i < g.belt.length; i++) {
    const s = g.belt[i];
    s.s += g.speed * dt;
    if (s.s >= g.L && s.spin) {
      // 转射机转完一圈就散掉，不回槽
      g.belt.splice(i, 1);
      i--;
      g.events.push({ type: 'empty', sh: s });
      continue;
    }
    if (s.s >= g.L) {
      if (g.dog && s.big && !s.extra) {
        s.s -= g.L;
        s.extra = true;
        g.events.push({ type: 'dogLap', sh: s });
        continue;
      }
      g.belt.splice(i, 1);
      i--;
      backToSlot(g, s);
      if (g.status !== 'play') return;
      continue;
    }
    const ln = laneAt(s.s, g.w, g.h);
    if (!ln) continue;
    const key = ln.dir * 100 + ln.k;
    if (key !== s.lane) {
      s.lane = key;
      s.laneDone = false;
    }
    if (s.laneDone) continue; // 这条线吃过了
    if (s.spin) {
      // 转射机：这条线最外面那格，什么颜色都打
      const idx = firstInLane(g.cells, g.w, g.h, ln.dir, ln.k);
      if (idx < 0) continue;
      s.laneDone = true;
      const c = g.cells[idx];
      g.cells[idx] = -1;
      g.left--;
      g.stageLeft--;
      g.counts[c]--;
      s.ammo--;
      g.events.push({ type: 'shot', idx, color: c, sh: s, k: 0, n: 1 });
      if (g.counts[c] === 0) {
        g.events.push({ type: 'colorClear', color: c, n: 1 });
        (g.gone || (g.gone = [])).push(c); // 下一帧开头再收掉这种颜色的连弩车
      }
      partCheck(g, c, idx);
      if (s.ammo <= 0) {
        g.belt.splice(i, 1);
        i--;
        g.events.push({ type: 'empty', sh: s });
      }
      if (g.left === 0) {
        g.status = 'win';
        g.events.push({ type: 'win' });
        return;
      }
      continue;
    }
    const run = laneRun(g.cells, g.w, g.h, ln.dir, ln.k, s.color, Math.min(s.ammo, CFG.perLane || s.ammo), CFG.pierce && s.big > 0);
    if (!run.length) continue; // 最外面不是同色：还在这条线上就接着等（别的连弩可能马上把外层剥掉）
    // 一口气吃掉这一串：规则上同一帧就清掉，画面按 k 一格格错开飞子弹（哒哒哒）
    s.laneDone = true;
    for (let k = 0; k < run.length; k++) {
      const idx = run[k];
      g.cells[idx] = -1;
      g.left--;
      g.stageLeft--;
      g.counts[s.color]--;
      s.ammo--;
      g.events.push({ type: 'shot', idx, color: s.color, sh: s, k, n: run.length });
    }
    if (g.counts[s.color] === 0) g.events.push({ type: 'colorClear', color: s.color, n: run.length });
    partCheck(g, s.color, run[run.length - 1]);
    if (g.status !== 'play') return;
    if (s.ammo <= 0) {
      g.belt.splice(i, 1);
      i--;
      g.events.push({ type: 'empty', sh: s });
    }
    if (g.left === 0) {
      g.status = 'win';
      g.events.push({ type: 'win' });
      return;
    }
    if (g.stageLeft === 0) {
      // 这张图清完了（子弹正好用光，传送带上不会剩连弩），停一下换下一张
      g.belt.length = 0;
      g.entering.length = 0;
      g.pause = CFG.stagePause;
      g.events.push({ type: 'stageClear', stage: g.stage });
      return;
    }
  }
}

// —— 机器人 ——
// 估一估：这台连弩现在上去，绕一圈大概能射掉几格（不管别的连弩）
function estimate(g, s, scratch) {
  const c = scratch || new Int8Array(g.cells.length);
  c.set(g.cells);
  const pierce = CFG.pierce && s.big > 0;
  let ammo = s.ammo;
  let hits = 0;
  const lanes = [
    [0, g.w, (j) => j],
    [1, g.h, (j) => g.h - 1 - j],
    [2, g.w, (j) => g.w - 1 - j],
    [3, g.h, (j) => j],
  ];
  for (const [dir, n, kf] of lanes) {
    for (let j = 0; j < n && ammo > 0; j++) {
      const run = laneRun(c, g.w, g.h, dir, kf(j), s.color, Math.min(ammo, CFG.perLane || ammo), pierce);
      for (const idx of run) c[idx] = -1;
      ammo -= run.length;
      hits += run.length;
    }
  }
  return hits;
}

// 挑下一步点哪台。noise = 有多大概率乱点（装成真人）
function botPick(g, rnd, noise) {
  if (!canLaunch(g)) return null;
  const cands = [];
  g.cols.forEach((c, i) => c.length && cands.push({ kind: 'col', i, s: c[0] }));
  g.slots.forEach((s, i) => s && !s.part && cands.push({ kind: 'slot', i, s }));
  if (!cands.length) return null;
  const scratch = new Int8Array(g.cells.length);
  let best = null;
  for (const c of cands) {
    c.hits = estimate(g, c.s, scratch);
    c.score = c.hits >= c.s.ammo ? 1000 + c.hits : c.hits + (c.kind === 'slot' && c.hits > 0 ? 0.5 : 0);
    if (!best || c.score > best.score) best = c;
  }
  // 装成真人：失手时多半是「在打得到的几台里随手挑了一台」，偶尔才完全点错
  if (noise && rnd() < noise) {
    const ok = cands.filter((c) => c.hits > 0);
    if (ok.length && rnd() < 0.8) return ok[Math.floor(rnd() * ok.length)];
    return cands[Math.floor(rnd() * cands.length)];
  }
  if (best.hits > 0) return best;
  if (onBelt(g) > 0) return null; // 等传送带上的先把外层清掉
  // 谁都打不到：掀开一列，挑后面那台最有用的
  let dig = null;
  for (const c of cands) {
    if (c.kind !== 'col') continue;
    const next = g.cols[c.i][1];
    const v = next ? estimate(g, next, scratch) : -1;
    if (!dig || v > dig.v) dig = Object.assign(c, { v });
  }
  return dig || cands[0];
}

// 机器人怎么处理零件：scrap = 一来就扔（不赌）；keep = 留着凑图纸，只剩 minFree 个空格时扔掉最没用的
function botParts(g, policy, minFree) {
  if (!g.partsOn) return;
  const idx = [];
  g.slots.forEach((s, i) => s && s.part && idx.push(i));
  if (!idx.length) return;
  if (policy === 'scrap') {
    for (const i of idx) tapSlot(g, i);
    return;
  }
  // 还差最少的那张图纸要的零件留着，其余的在格子紧的时候扔
  const have = {};
  for (const i of idx) have[g.slots[i].part] = (have[g.slots[i].part] || 0) + 1;
  let target = null, best = 9;
  for (const k of g.recipes) {
    const want = {};
    for (const p of RECIPES[k]) want[p] = (want[p] || 0) + 1;
    let miss = 0;
    for (const p in want) miss += Math.max(0, want[p] - (have[p] || 0));
    if (miss < best) { best = miss; target = want; }
  }
  const useful = (p) => target && target[p];
  while (freeSlots(g) < (minFree || 2)) {
    const list = [];
    g.slots.forEach((s, i) => s && s.part && list.push(i));
    if (!list.length) break;
    const junk = list.find((i) => !useful(g.slots[i].part));
    tapSlot(g, junk !== undefined ? junk : list[0]);
  }
  for (const i of idx) if (g.slots[i] && g.slots[i].part && !useful(g.slots[i].part)) tapSlot(g, i);
}

function botTap(g, pick) {
  return pick.kind === 'col' ? tapColumn(g, pick.i) : tapSlot(g, pick.i);
}

// 无头跑一局：返回 { win, time, left, total, taps }
function simulate(level, seed, opt) {
  opt = opt || {};
  const g = createGame(level, opt.gameOpts);
  const r = rng(seed);
  const dt = 1 / 30;
  const noise = opt.noise || 0;
  let wait = 0;
  while (g.status === 'play' && g.time < (opt.maxTime || 600)) {
    wait -= dt;
    if (wait <= 0) {
      botParts(g, opt.parts || 'keep', opt.minFree);
      const p = botPick(g, r, noise);
      if (p) {
        botTap(g, p);
        wait = (opt.react || 0.25) * (0.6 + r() * 0.8);
      } else wait = 0.1;
    }
    step(g, dt);
    g.events.length = 0;
  }
  return { win: g.status === 'win', time: g.time, left: g.left, total: g.total, taps: g.taps, free: freeSlots(g), hu: g.huCount || 0 };
}

// 闭眼乱点：能点就随便点一台（用来查「会玩和乱点差多少」，差得少 = 选择不重要 = 不好玩）
function simulateRandom(level, seed, opt) {
  opt = opt || {};
  const g = createGame(level, opt.gameOpts);
  const r = rng(seed);
  const dt = 1 / 30;
  let wait = 0;
  while (g.status === 'play' && g.time < 900) {
    wait -= dt;
    if (wait <= 0 && canLaunch(g)) {
      const c = [];
      g.cols.forEach((x, i) => x.length && c.push({ kind: 'col', i }));
      g.slots.forEach((x, i) => x && c.push({ kind: 'slot', i })); // 乱点：零件也会被点到（= 扔掉）
      if (c.length) botTap(g, c[Math.floor(r() * c.length)]);
      wait = (opt.react || 0.6) * (0.6 + r() * 0.8);
    }
    step(g, dt);
    g.events.length = 0;
  }
  return { win: g.status === 'win', time: g.time, left: g.left, total: g.total };
}

// —— 照做版：把每种颜色的格子数修成整十（弹药只出 10/20/30/40，一眼能算） ——
// 只动颜色交界处几格：零头 ≤5 就把这几格让给旁边（空白或邻色），>5 就从旁边借几格补齐。
// 从少到多一个个修，最多的颜色（多半是底色）最后修；没有空白的图总格数是整十，最后一色自动整十。
function round10(cells, w, h) {
  const nb = (i) => {
    const x = i % w, y = (i / w) | 0, o = [];
    if (x > 0) o.push(i - 1);
    if (x < w - 1) o.push(i + 1);
    if (y > 0) o.push(i - w);
    if (y < h - 1) o.push(i + w);
    return o;
  };
  const count = () => {
    const n = new Array(ORDER.length).fill(0);
    for (let i = 0; i < cells.length; i++) if (cells[i] >= 0) n[cells[i]]++;
    return n;
  };
  // 铺满的图总格数不是整十（16×16=256、18×18=324）：先从四个角往里挖掉零头那几格
  let total = 0;
  for (let i = 0; i < cells.length; i++) if (cells[i] >= 0) total++;
  // 原图有空白：零头可以让给空白；铺满的图只在颜色之间挪，总数保持整十
  const useEmpty = total < cells.length;
  const cut = total % 10;
  if (cut) {
    const corners = [[0, 0, 1, 0], [w - 1, 0, -1, 0], [0, h - 1, 1, 0], [w - 1, h - 1, -1, 0]];
    let done = 0;
    for (let step = 0; done < cut && step < w; step++)
      for (const [x0, y0, dx] of corners) {
        if (done >= cut) break;
        const i = y0 * w + x0 + dx * step;
        if (cells[i] >= 0) { cells[i] = -1; done++; }
      }
  }
  for (let pass = 0; pass < 6; pass++) {
    const n0 = count();
    // 修的顺序：从最多的颜色（根）出发按「挨着」往外找，离根最远的先修，每色总有一个挨着它、后修的颜色可以交换
    const present = n0.map((v, c) => c).filter((c) => n0[c] > 0);
    const adj = {};
    present.forEach((c) => (adj[c] = new Set()));
    for (let i = 0; i < cells.length; i++) {
      if (cells[i] < 0) continue;
      for (const j of nb(i)) if (cells[j] >= 0 && cells[j] !== cells[i]) adj[cells[i]].add(cells[j]);
    }
    const root = present.slice().sort((a, b) => n0[b] - n0[a])[0];
    const seen = [root];
    for (let q = 0; q < seen.length; q++) for (const v of [...adj[seen[q]]].sort((a, b) => n0[b] - n0[a])) if (!seen.includes(v)) seen.push(v);
    present.forEach((c) => !seen.includes(c) && seen.push(c));
    const colors = seen.slice().reverse();
    // 只和排在后面（更多）的颜色、或空白交换，修好的颜色不会再被碰乱
    const rank = {};
    colors.forEach((c, k) => (rank[c] = k));
    const later = (c, v) => (v < 0 ? useEmpty : rank[v] > rank[c]);
    let changed = false;
    for (const c of colors) {
      const n = count();
      const r = n[c] % 10;
      if (!r) continue;
      changed = true;
      // 邻居里谁最多（空白算 -1，优先给空白）
      const pickTo = (i) => {
        const vs = nb(i).map((j) => cells[j]).filter((v) => v !== c && later(c, v));
        if (!vs.length) return null;
        if (vs.includes(-1) && useEmpty) return -1;
        const cs = vs.filter((v) => v >= 0);
        if (!cs.length) return null;
        return cs.sort((a, b) => n[b] - n[a])[0];
      };
      if (r <= 5) {
        // 去掉 r 格：挑同色邻居最少的（突出的那几格），让给旁边
        const cand = [];
        for (let i = 0; i < cells.length; i++) if (cells[i] === c) {
          const to = pickTo(i);
          if (to === null) continue;
          const same = nb(i).filter((j) => cells[j] === c).length;
          cand.push({ i, to, k: same * 10 + (to === -1 ? 0 : 5) + ((i * 7) % 5) * 0.1 });
        }
        cand.sort((a, b) => a.k - b.k);
        for (let t = 0; t < r && t < cand.length; t++) cells[cand[t].i] = cand[t].to;
      } else {
        // 补 10-r 格：挑紧挨着这色、同色邻居最多的格（填凹口），优先空白，其次最多的那色
        const need = 10 - r;
        const cand = [];
        for (let i = 0; i < cells.length; i++) {
          const v = cells[i];
          if (v === c || !later(c, v)) continue;
          const same = nb(i).filter((j) => cells[j] === c).length;
          if (!same) continue;
          cand.push({ i, k: -same * 10 + (v === -1 ? 0 : 3) - (v >= 0 ? n[v] / 1000 : 0) + ((i * 7) % 5) * 0.1 });
        }
        cand.sort((a, b) => a.k - b.k);
        for (let t = 0; t < need && t < cand.length; t++) cells[cand[t].i] = c;
      }
    }
    if (!changed) break;
  }
  return cells;
}

// —— 给图出关 ——
// def: { art: [...字符串], warm: { name, art }（可选：先来的那件小东西）, cols: 列数, slots: 槽数, chunks: [每台子弹数可选值] }
// 每张图：数每种颜色多少格 → 拆成一台台连弩 → 洗牌发进几列 → 机器人试打一遍，保证有解
function buildStage(art0, def, seed) {
  // fill：把空白填成一种底色（原型用来「整张填满」加难度；玩具版的图都不填，留空才看得出形状）
  const art = def.fill ? art0.map((r) => r.replace(/\./g, def.fill)) : art0;
  const img = parseArt(art, def.scale || 1);
  if (def.round10) round10(img.cells, img.w, img.h);
  const r = rng(seed);
  const counts = new Array(ORDER.length).fill(0);
  const depthSum = new Array(ORDER.length).fill(0);
  const dm = depthMap(img.cells, img.w, img.h);
  img.cells.forEach((c, i) => {
    if (c >= 0) {
      counts[c]++;
      depthSum[c] += dm[i];
    }
  });
  let maxDepth = 1;
  counts.forEach((n, c) => n && (maxDepth = Math.max(maxDepth, depthSum[c] / n)));
  const shooters = [];
  const chunks = def.chunks || [4, 6, 8];
  const maxChunk = Math.max.apply(null, chunks);
  const minChunk = Math.min.apply(null, chunks);
  counts.forEach((n, color) => {
    while (n > 0) {
      let a = Math.min(n, chunks[Math.floor(r() * chunks.length)]);
      if (n - a > 0 && n - a < minChunk / 2) a = n; // 别剩零头
      shooters.push({ color, ammo: a, depth: depthSum[color] / counts[color] / maxDepth });
      n -= a;
    }
  });
  // bury：越大，埋在里层的颜色越容易排在前面（越难）。机器人打不过就一点点放松
  let bury = def.bury || 0;
  let lvl = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    // tail < 0：子弹少的小连弩往后排；玩具版默认 0（不故意堵）
    const tail = def.tail === undefined ? 0 : def.tail;
    const keyed = shooters.map((s) => ({ s, key: r() - bury * s.depth + (tail * s.ammo) / maxChunk }));
    keyed.sort((a, b) => a.key - b.key);
    // 开局顺手：最前面 head 那几台按「先外层、后里层」重排
    const head = Math.round(keyed.length * (def.head === undefined ? 0.35 : def.head));
    const front = keyed.slice(0, head).sort((a, b) => a.s.depth - b.s.depth + (r() - 0.5) * 0.3);
    keyed.splice(0, head, ...front);
    const cols = [];
    for (let i = 0; i < def.cols; i++) cols.push([]);

      S.huText = { str: MACHINE_NAME[e.recipe] + '！', sub: e.recipe === 'que' ? '吃掉一整种颜色' : e.recipe === 'spin' ? '转一圈，什么颜色都打' : '多一个槽', t: 0 };
      S.hitstop = 0.12;
      S.shake = Math.max(S.shake, 10);
      S.flash = Math.max(S.flash, 0.6);
      S.rings.push({ x: to.x, y: to.y, r0: 10, r1: W * 0.6, t: 0, dur: 0.5, color: '#ffe38a', w: 8 });
      P.sound('merge', 0.9);
      P.vibrate(true);
      break;
    }
    case 'zap': {
      // 铜雀：从图纸那边飞上棋盘，一路把这种颜色啄光
      const L = S.L;
      const o = { x: W / 2, y: L.by + L.bh + 10 };
      S.birdFly = { t: 0, dur: 0.9, x0: -40, y0: L.by + L.bh * 0.7, x1: W + 40, y1: L.by + L.bh * 0.2 };
      e.idxs.forEach((idx, n) => {
        const to = cellCenter(idx);
        S.bullets.push({ sh: null, origin: o, x0: 0, y0: 0, x1: to.x, y1: to.y, t: -0.05 - n * (0.6 / Math.max(1, e.idxs.length)), dur: 0.12, color: e.color, idx, k: 0, n: 1, pitch: n % 12, started: false });
      });
      S.rings.push({ x: L.bx + L.bw / 2, y: L.by + L.bh / 2, r0: 20, r1: L.bw, t: 0.2, dur: 0.6, color: COL[e.color].light, w: 10 });
      P.sound('clear', 0.9);
      break;
    }
    case 'spinIn': {
      const p = beltXY(0);

      P.sound('launch', 0.8);

    case 'kiteSlot': {
      setTimeout0(() => {
        const p = slotPos(e.at, g.slots.length);
        S.rings.push({ x: p.x, y: p.y, r0: 6, r1: 50, t: 0, dur: 0.45, color: '#c98f55', w: 6 });
        P.sound('pet', 0.7);
      }, 200);

  }
}

function giveReward(win) {
  const g = S.g;
  const n = S.levelNo;
  const r = { win, coins: 0, pet: null, scene: n % ART.COUNT, pageDone: false, doubled: false };
  if (win) {
    r.coins = 20 + 5 * Math.min(n, 10);
    if (save.pets.que) r.coins = Math.round(r.coins * 1.5);
    if (!save.album[r.scene]) {
      save.album[r.scene] = true;
      save.newAlbum = true;
      const page = Math.floor(r.scene / 4);
      r.pageDone = [0, 1, 2, 3].every((k) => save.album[page * 4 + k]);
    }
    for (const p of PETS) {
      if (p.at === n && !save.pets[p.id]) {
        save.pets[p.id] = true;
        r.pet = p;
      }
    }
  } else {
    r.coins = 3 + Math.floor((1 - g.left / g.total) * 10);
  }
  save.coins += r.coins;
  persist();
  S.reward = r;
}

// —— 每帧 ——
function update(dt) {
  dt *= S.timeScale;
  S.time += dt;
  if (S.toast) {
    S.toast.t -= dt;
    if (S.toast.t <= 0) S.toast = null;
  }
  if (S.tip2 > 0) S.tip2 -= dt;
  if (S.huText) {
    S.huText.t += dt;
    if (S.huText.t > 1.3) S.huText = null;
  }
  if (S.huFlash) {
    S.huFlash.t -= dt * 1.5;
    if (S.huFlash.t <= 0) S.huFlash = null;
  }
  if (S.ad) {
    S.ad.t -= dt;
    if (S.ad.t <= 0) {
      const cb = S.ad.cb;
      S.ad = null;
      cb();
    }
    return;
  }
  const g = S.g;
  // 特效
  for (let i = S.bullets.length - 1; i >= 0; i--) {
    const b = S.bullets[i];
    b.t += dt;
    if (b.t < 0) continue; // 还没轮到这一发
    if (!b.started) {
      b.started = true;
      if (b.origin) {
        b.x0 = b.origin.x;
        b.y0 = b.origin.y;
      } else {
        const from = beltXY(b.sh.s);
        b.x0 = from.x + Math.cos(from.ang) * S.L.cartR;
        b.y0 = from.y + Math.sin(from.ang) * S.L.cartR;
      }
    }
    if (b.t >= b.dur) {
      S.bullets.splice(i, 1);
      popCell(b);
    }
  }
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i];
    p.life -= dt;
    if (p.life <= 0) {
      S.parts.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.soft ? -20 : 420) * dt;
  }
  if (S.birdFly) {
    S.birdFly.t += dt;
    if (S.birdFly.t > S.birdFly.dur) S.birdFly = null;
  }
  for (const list of [S.rings, S.ghosts, S.floaters]) {
    for (let i = list.length - 1; i >= 0; i--) {
      list[i].t += dt;
      if (list[i].t >= (list[i].dur || 0.9)) list.splice(i, 1);
    }
  }
  S.comboPulse = Math.max(0, S.comboPulse - dt * 5);
  S.comboShow = Math.max(0, S.comboShow - dt);
  S.boardBounce = Math.max(0, S.boardBounce - dt * 3);
  for (let i = S.pops.length - 1; i >= 0; i--) {
    S.pops[i].t += dt;
    if (S.pops[i].t >= 0.18) S.pops.splice(i, 1);
  }
  S.shake = Math.max(0, S.shake - dt * 30);
  S.flash = Math.max(0, S.flash - dt * 2.5);
  S.slotFlash = Math.max(0, S.slotFlash - dt);
  S.beltFlash = Math.max(0, S.beltFlash - dt);
  if (!g) return;
  for (const sh of allShooters()) {
    if (sh.flyT !== undefined) sh.flyT += dt;
    if (sh.popT !== undefined) sh.popT += dt;
  }
  if (S.album.open || S.card) return;
  if (S.hitstop > 0) {
    S.hitstop -= dt;
  } else if (g.status === 'play') {
    S.acc += dt;
    while (S.acc >= STEP) {
      core.step(g, STEP);
      S.acc -= STEP;
      for (const e of g.events) onEvent(e);
      g.events.length = 0;
      if (g.status !== 'play') break;
    }
  }
  for (const e of g.events) onEvent(e);
  g.events.length = 0;
  if (g.status !== 'play') {
    S.endT += dt;
    if (g.status === 'win' && S.revealT < 0 && S.bullets.length === 0) {
      S.revealT = 0;
      S.flash = 0.6;
      S.hitstop = 0.15;
      P.sound('win', 0.7);
      setTimeout0(() => P.sound('reveal', 0.6), 300);
    }
    if (S.revealT >= 0) S.revealT += dt;
    if (S.stats.lastEnd === null) S.stats.lastEnd = S.time;
  }
}

// 一格被打掉：挖洞露出插画 + 这一格碎成好几块往外崩 + 白闪一下 + 「哒」（一串里越往里音越高）+ 连击加一
function popCell(b) {
  const L = S.L;
  clearCell(b.idx);
  const k = COL[b.color];
  // 从传送带那边打过来：碎块顺着子弹方向往里崩，再四散落下
  const dx = b.x1 - b.x0;
  const dy = b.y1 - b.y0;
  const d = Math.max(1, Math.hypot(dx, dy));
  for (let j = 0; j < 5; j++) {
    const a = Math.random() * Math.PI * 2;
    const v = 70 + Math.random() * 150;
    S.parts.push({
      x: b.x1 + (Math.random() - 0.5) * L.cs * 0.5,
      y: b.y1 + (Math.random() - 0.5) * L.cs * 0.5,
      vx: Math.cos(a) * v + (dx / d) * 120,
      vy: Math.sin(a) * v + (dy / d) * 120 - 90,
      life: 0.55,
      max: 0.55,
      color: j === 0 ? k.light : j === 4 ? k.dark : k.base,
      size: L.cs * (0.35 + Math.random() * 0.3),
      spin: (Math.random() - 0.5) * 20,
    });
  }
  S.pops.push({ x: b.x1, y: b.y1, t: 0, color: k.light });
  // 连击：0.7 秒内接着打掉就一直往上加
  if (S.time - S.comboT > 0.7) S.combo = 0;
  S.combo++;
  S.comboT = S.time;
  if (S.combo > S.stats.maxCombo) S.stats.maxCombo = S.combo;
  S.comboShow = 1.0;
  S.comboPulse = 1;
  if (S.combo >= 10) S.shake = Math.max(S.shake, Math.min(10, 1.5 + S.combo / 10));
  if (S.combo % 25 === 0) {
    // 每 25 连：一圈热色光环 + 往上冲的一声
    const p = comboPos();
    S.rings.push({ x: p.x - 30, y: p.y, r0: 10, r1: 90, t: 0, dur: 0.45, color: comboColor(S.combo), w: 8 });
    P.sound('combo', 0.6);
  }
  // 「哒」：这台连弩这一趟吃到第几格就往上升几个半音
  if (S.time - S.lastPop > 0.018) {
    S.lastPop = S.time;
    const pitch = Math.min(23, b.pitch);
    P.sound('pop' + pitch, 0.4);
  }
}

// 连击字放在屏幕右边、棋盘上半截旁边
function comboPos() {
  const L = S.L;
  return { x: W - 10, y: L.by + L.bh * 0.18 };
}

// 连击越多颜色越热：黄 → 橙 → 红 → 粉 → 白热
function comboColor(n) {
  if (n < 15) return '#ffe08a';
  if (n < 30) return '#ffb347';
  if (n < 50) return '#ff6b4a';
  if (n < 80) return '#ff4d9a';
  return '#fff4fb';
}

function drawCombo() {
  if (S.combo < 5 || S.comboShow <= 0) return;
  if (S.revealT > 0.3) return; // 插画刷开时让开
  const p = comboPos();
  const n = S.combo;
  const size = Math.min(64, 22 + n * 0.55) * (1 + 0.25 * S.comboPulse);
  const a = Math.min(1, S.comboShow / 0.3);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(p.x, p.y);
  ctx.rotate(-0.12);
  const col = comboColor(n);
  // 越热越抖
  const jit = n >= 30 ? (Math.random() - 0.5) * Math.min(4, n / 20) : 0;
  text('连击', -4 + jit, -size * 0.62, Math.max(13, size * 0.38), '#fff6e0', 'right', INK);
  text('×' + n, jit, size * 0.08, size, col, 'right', n >= 50 ? '#7a1240' : INK);
  ctx.restore();
}

let pendingTimers = [];
function setTimeout0(fn, ms) {
  pendingTimers.push({ at: S.time + ms / 1000, fn });
}
function runTimers() {
  for (let i = pendingTimers.length - 1; i >= 0; i--) {
    if (S.time >= pendingTimers[i].at) {
      const f = pendingTimers[i].fn;
      pendingTimers.splice(i, 1);
      f();
    }
  }
}

function allShooters() {
  const g = S.g;
  const out = [];
  for (const s of g.belt) out.push(s);
  for (const s of g.entering) out.push(s);
  for (const s of g.slots) if (s) out.push(s);
  return out;
}

// —— 画 ——
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function circle(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
}

function text(str, x, y, size, color, align, stroke) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineWidth = Math.max(2, size / 5);
    ctx.strokeStyle = stroke;
    ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function coinIcon(x, y, r) {
  circle(x, y, r);
  ctx.fillStyle = '#f5cf4c';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.fillStyle = '#a8851a';
  ctx.fillRect(x - r * 0.3, y - r * 0.3, r * 0.6, r * 0.6);
}

// 一台蒸汽连弩车
const HIDDEN = { base: '#6d6670', light: '#9a929c', dark: '#4a444d' };
const SPIN = { base: '#fff1c8', light: '#ffffff', dark: '#d9a441' };
function drawShooter(x, y, r, sh, ang, alpha) {
  if (sh.part) {
    drawPart(x, y, r, sh.part, alpha);
    return;
  }
  const k = sh.hidden ? HIDDEN : sh.spin ? SPIN : COL[sh.color];
  const big = sh.big || 0;
  r *= 1 + 0.16 * big;
  if (sh.popT !== undefined && sh.popT < 0.3) r *= 1 + 0.35 * Math.sin((sh.popT / 0.3) * Math.PI);
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(x, y);
  // 合体大连弩：外面一圈转动的齿轮
  if (big) {
    ctx.save();
    ctx.rotate(S.time * 2.5);
    ctx.beginPath();
    const teeth = 10;
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2;
      const q = i % 2 === 0 ? r * 1.22 : r * 1.02;
      ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q);
      ctx.lineTo(Math.cos(a + Math.PI / teeth) * q, Math.sin(a + Math.PI / teeth) * q);
    }
    ctx.closePath();
    ctx.fillStyle = BRASS_L;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.restore();
  }
  // 弩口
  ctx.save();
  ctx.rotate(ang === undefined ? -Math.PI / 2 : ang);
  ctx.fillStyle = BRASS_D;
  ctx.fillRect(r * 0.5, -r * 0.22, r * 0.75, r * 0.44);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = INK;
  ctx.strokeRect(r * 0.5, -r * 0.22, r * 0.75, r * 0.44);
  ctx.restore();
  // 铜座
  circle(0, 0, r);
  ctx.fillStyle = BRASS;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  // 颜色核心
  circle(0, 0, r * 0.76);
  ctx.fillStyle = k.base;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.76, Math.PI * 1.05, Math.PI * 1.6);
  ctx.lineWidth = r * 0.16;
  ctx.strokeStyle = k.light;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.76, Math.PI * 0.1, Math.PI * 0.75);
  ctx.strokeStyle = k.dark;
  ctx.stroke();
  // 子弹数
  text(sh.hidden ? '?' : sh.spin ? '✦' + sh.ammo : String(sh.ammo), 0, 1, Math.round(r * (sh.ammo >= 100 ? 0.62 : 0.8)), '#fff', 'center', INK);
  ctx.restore();
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function ease(t) {
  t = Math.max(0, Math.min(1, t));
  return 1 - Math.pow(1 - t, 3);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#22171f');
  g.addColorStop(1, '#120d14');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.07;
  ART.gear(ctx, W * 0.1, H * 0.62, W * 0.3, 14, BRASS, S.time * 0.1, 2);
  ART.gear(ctx, W * 0.95, H * 0.85, W * 0.22, 11, BRASS, -S.time * 0.14, 2);
  ctx.globalAlpha = 1;
}

function drawTopBar() {
  const L = S.L;
  const g = S.g;

  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#f2e6cc';
  ctx.fillRect(bx - 11, y - 10, 9, 20);
  ctx.fillRect(bx + 2, y - 10, 9, 20);
  ctx.fillStyle = BRASS;
  ctx.fillRect(bx - 1, y - 11, 2, 22);
  if (save.newAlbum) {

function drawBoard() {
  const L = S.L;
  const g = S.g;
  // 铜框
  rr(L.bx - 6, L.by - 6, L.bw + 12, L.bh + 12, 6);
  ctx.fillStyle = BRASS_D;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  for (const [x, y] of [[L.bx - 3, L.by - 3], [L.bx + L.bw + 3, L.by - 3], [L.bx - 3, L.by + L.bh + 3], [L.bx + L.bw + 3, L.by + L.bh + 3]]) {
    circle(x, y, 2.5);
    ctx.fillStyle = BRASS_L;
    ctx.fill();
  }
  ctx.save();
  if (S.boardBounce > 0) {
    // 新图掉下来：先压扁一点再弹回
    const t = 1 - S.boardBounce;
    const sc = 1 + Math.sin(t * Math.PI) * 0.06 * S.boardBounce;
    ctx.translate(L.bx + L.bw / 2, L.by + L.bh / 2 - S.boardBounce * S.boardBounce * 30);
    ctx.scale(sc, 2 - sc);
    ctx.translate(-(L.bx + L.bw / 2), -(L.by + L.bh / 2));
  }
  ctx.drawImage(S.illus, L.bx, L.by, L.bw, L.bh);
  // 过关：剩下的蓝图纸从中间往外烧开，整张插画露出来
  if (S.revealT >= 0) {
    const t = ease(S.revealT / 0.9);
    if (t < 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(L.bx, L.by, L.bw, L.bh);
      ctx.arc(L.bx + L.bw / 2, L.by + L.bh / 2, t * L.bw * 0.75, 0, Math.PI * 2, true);
      ctx.clip('evenodd');
      ctx.drawImage(S.cover, L.bx, L.by, L.bw, L.bh);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(L.bx + L.bw / 2, L.by + L.bh / 2, t * L.bw * 0.75, 0, Math.PI * 2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,220,140,' + (1 - t) + ')';
      ctx.save();
      ctx.beginPath();
      ctx.rect(L.bx, L.by, L.bw, L.bh);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(L.bx + L.bw / 2, L.by + L.bh / 2, t * L.bw * 0.75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  } else {
    ctx.drawImage(S.cover, L.bx, L.by, L.bw, L.bh);
  }
  ctx.restore();
}

function drawBelt() {
  const L = S.L;
  const g = S.g;
  const x0 = L.bx - L.o * L.cs;
  const y0 = L.by - L.o * L.cs;
  const bw = L.bw + 2 * L.o * L.cs;
  const bh = L.bh + 2 * L.o * L.cs;
  const r0 = L.o * L.cs;
  const band = L.cartR * 2 + 2;
  rr(x0, y0, bw, bh, r0);
  ctx.lineWidth = band + 4;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.lineWidth = band;
  ctx.strokeStyle = '#2f242c';
  ctx.stroke();
  // 履带纹：跟着传送带一起走
  ctx.save();
  ctx.setLineDash([3, L.cs * 1.4]);
  ctx.lineDashOffset = -S.time * core.CFG.speed * L.cs;
  ctx.lineWidth = band - 8;
  ctx.strokeStyle = '#3d3038';
  ctx.stroke();
  ctx.restore();
  for (const d of [band / 2, -band / 2]) {
    rr(x0 - d, y0 - d, bw + 2 * d, bh + 2 * d, Math.max(2, r0 + d));
    ctx.lineWidth = 3;
    ctx.strokeStyle = BRASS;
    ctx.stroke();
  }
  // 入口：小灯 = 传送带上已经有几台
  const cap = core.CFG.beltCap;
  const ey = L.by + L.bh + L.o * L.cs + band / 2 + 10;
  for (let i = 0; i < cap; i++) {
    const on = i < core.onBelt(g);
    circle(W / 2 + (i - (cap - 1) / 2) * 14, ey, 4.5);
    ctx.fillStyle = on ? (S.beltFlash > 0 && Math.floor(S.time * 12) % 2 ? '#ff6b6b' : '#ffcf6b') : '#3a2c33';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = INK;
    ctx.stroke();
  }
  // 传送带上的连弩
  for (const sh of g.belt) {
    const p = beltXY(sh.s);
    sh.lastXY = p;
    let x = p.x;
    let y = p.y;
    if (sh.from && sh.flyT < 0.16) {
      const t = ease(sh.flyT / 0.16);
      x = lerp(sh.from.x, x, t);
      y = lerp(sh.from.y, y, t);
    }
    drawShooter(x, y, L.cartR, sh, p.ang);
  }
  for (let i = 0; i < g.entering.length; i++) {
    const sh = g.entering[i];
    const p = beltXY(0);
    const t = sh.from ? ease((sh.flyT || 0) / 0.16) : 1;
    drawShooter(lerp(sh.from ? sh.from.x : p.x, p.x - 4 * i, t), lerp(sh.from ? sh.from.y : p.y, p.y + 6 * i, t), L.cartR, sh, -Math.PI / 2, 0.85);
  }
}

function drawSlots() {
  const L = S.L;
  const g = S.g;
  const n = g.slots.length;
  const free = core.freeSlots(g);
  const danger = (free <= 1 && g.status === 'play') || g.status === 'full';
  for (let i = 0; i < n; i++) {
    const p = slotPos(i, n);
    rr(p.x - L.slotR - 4, p.y - L.slotR - 4, L.slotR * 2 + 8, L.slotR * 2 + 8, 10);
    ctx.fillStyle = '#1a1217';
    ctx.fill();
    ctx.lineWidth = 3;
    const blink = danger && Math.floor(S.time * 6) % 2 === 0;
    ctx.strokeStyle = blink && !g.slots[i] ? '#ff5a5a' : danger ? '#b84a3a' : BRASS_D;
    ctx.stroke();
    if (S.slotFlash > 0 && !g.slots[i]) {
      ctx.fillStyle = 'rgba(255,80,80,' + S.slotFlash * 0.4 + ')';
      ctx.fill();
    }
  }
  for (let i = 0; i < n; i++) {
    const sh = g.slots[i];
    if (!sh) continue;
    const p = slotPos(i, n);
    let x = p.x;
    let y = p.y;
    if (sh.from && sh.flyT < 0.2) {
      const t = ease(sh.flyT / 0.2);
      x = lerp(sh.from.x, x, t);
      y = lerp(sh.from.y, y, t);
    }
    drawShooter(x, y, L.slotR * 0.92, sh);
  }
  // 合体时飞过去的两台
  for (const gh of S.ghosts) {
    const t = ease(gh.t / gh.dur);
    drawShooter(lerp(gh.x0, gh.x1, t), lerp(gh.y0, gh.y1, t), L.slotR * 0.9 * (1 - t * 0.5), gh.part ? { part: gh.part } : { color: gh.color, ammo: '', big: 0 }, undefined, 1 - t * 0.5);
  }
  // 槽满了：多出来的那台悬在上面发抖
  if (g.status === 'full' && g.overflow) {
    const p = slotPos(n - 1, n);
    const sx = Math.sin(S.time * 50) * 3;
    drawShooter(p.x + L.slotR * 2.3 + sx, p.y, L.slotR * 0.92, g.overflow);
    text('✕', p.x + L.slotR * 2.3 + sx + 14, p.y - 16, 18, '#ff5a5a', 'center', INK);
  }
}

function drawColumns() {
  const L = S.L;
  const g = S.g;
  const n = g.cols.length;
  const can = core.canLaunch(g);
  for (let c = 0; c < n; c++) {
    const x = colX(c, n);
    const list = g.cols[c];
    // 底槽
    rr(x - 36, L.colTop, 72, H - L.colTop - 14, 18);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    for (let j = Math.min(list.length, 5) - 1; j >= 0; j--) {
      const sh = list[j];
      const y = colItemY(j);
      const bob = j === 0 ? Math.sin(S.time * 4 + c) * 1.5 : 0;
      const r = j === 0 ? 28 : 21 - j * 1.5;
      // 问号炮台：只露每列最前面那台，后面的排到最前面才翻开
      const show = j > 0 && S.def.mystery ? { color: sh.color, ammo: sh.ammo, big: 0, hidden: true } : sh;
      drawShooter(x, y + bob, r, show, -Math.PI / 2, j === 0 ? (can ? 1 : 0.6) : 0.75 - j * 0.12);
    }
    if (list.length > 5) text('+' + (list.length - 5), x, colItemY(5) - 6, 12, '#8a7a80');
  }
  // 第一关的手势：点最前面那台
  if (!save.hinted && g.status === 'play' && S.levelNo === 0) {
    const x = colX(0, n);
    const y = colItemY(0);
    const t = (S.time % 1.2) / 1.2;
    const press = t < 0.3 ? t / 0.3 : t < 0.5 ? 1 : 1 - (t - 0.5) / 0.7;
    drawHand(x + 18, y + 30 - press * 10, press);
    tipText('点炮台，放上传送带');
  }
  if (S.tip2 > 0 && S.levelNo === 0) tipText('等它转一圈，自己会打同色的格子', Math.min(1, S.tip2 / 0.4));
}

// 教学字：棋盘和槽之间一条深色条（只有第 1 关有，一共两句）
function tipText(str, alpha) {
  const L = S.L;
  const y = L.slotY - L.slotR - 16;
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  rr(W / 2 - 150, y - 15, 300, 30, 15);
  ctx.fillStyle = 'rgba(20,12,18,0.82)';
  ctx.fill();
  text(str, W / 2, y + 1, 15, '#fff3c4');
  ctx.restore();
}

// —— 攻防组装：零件、图纸、合体 ——
const PART_NAME = { head: '铜头', wing: '木翅', arm: '弩臂', gear: '齿轮' };
const MACHINE_NAME = { que: '铜雀', spin: '转射机', kite: '木鸢' };
// 一个零件：铜底圆盘上画零件的样子（代码画）
function drawPart(x, y, r, part, alpha, dim) {
  ctx.save();
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha) * (dim ? 0.35 : 1);
  ctx.translate(x, y);
  rr(-r, -r, r * 2, r * 2, r * 0.35);
  ctx.fillStyle = '#3b2a22';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = dim ? '#5a4a40' : BRASS;
  ctx.stroke();
  const q = r * 0.62;
  ctx.lineWidth = Math.max(1.5, r * 0.09);
  ctx.strokeStyle = INK;
  if (part === 'head') {
    // 铜雀的头：圆头 + 尖嘴 + 一只眼
    circle(-q * 0.1, 0, q * 0.62);
    ctx.fillStyle = BRASS_L;
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(q * 0.45, -q * 0.15);
    ctx.lineTo(q * 1.0, q * 0.05);
    ctx.lineTo(q * 0.45, q * 0.25);
    ctx.closePath();
    ctx.fillStyle = '#e07a3a';
    ctx.fill();
    ctx.stroke();
    circle(0, -q * 0.12, q * 0.13);
    ctx.fillStyle = INK;
    ctx.fill();
  } else if (part === 'wing') {
    // 木翅：三片木羽
    for (let k = 0; k < 3; k++) {
      ctx.save();
      ctx.rotate(-0.5 + k * 0.42);
      ctx.beginPath();
      ctx.ellipse(q * 0.15, 0, q * 0.95, q * 0.26, 0, 0, Math.PI * 2);
      ctx.fillStyle = k === 1 ? '#c98f55' : '#a8703f';
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  } else if (part === 'arm') {
    // 弩臂：一张弓 + 弦 + 一支箭
    ctx.beginPath();
    ctx.arc(q * 0.6, 0, q * 1.0, Math.PI * 0.62, Math.PI * 1.38);
    ctx.strokeStyle = '#8a5a2e';
    ctx.lineWidth = Math.max(2.5, r * 0.16);
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#f2e6cc';
    ctx.beginPath();
    ctx.moveTo(q * 0.6 + Math.cos(Math.PI * 0.62) * q, Math.sin(Math.PI * 0.62) * q);
    ctx.lineTo(q * 0.6 + Math.cos(Math.PI * 1.38) * q, Math.sin(Math.PI * 1.38) * q);
    ctx.stroke();
    ctx.strokeStyle = BRASS_L;
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    ctx.beginPath();
    ctx.moveTo(-q * 0.9, 0);
    ctx.lineTo(q * 0.9, 0);
    ctx.stroke();
  } else {
    ART.gear(ctx, 0, 0, q * 0.85, 8, BRASS_L, S.time * 0.8, 1.5);
    circle(0, 0, q * 0.25);
    ctx.fillStyle = '#3b2a22';
    ctx.fill();
  }
  ctx.restore();
}

// 机关的小图标（图纸左边）
function drawMachineIcon(x, y, s, k, lit) {
  ctx.save();
  ctx.globalAlpha = lit ? 1 : 0.8;
  if (k === 'que') ART.bird(ctx, x, y, s * 0.55, 0);
  else if (k === 'spin') {
    ART.gear(ctx, x, y, s * 0.5, 10, BRASS_L, S.time * (lit ? 4 : 0.6), 1.5);
    for (let a = 0; a < 4; a++) {
      const t = (a * Math.PI) / 2 + S.time * (lit ? 4 : 0.6);
      ctx.strokeStyle = '#8a5a2e';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(t) * s * 0.3, y + Math.sin(t) * s * 0.3);
      ctx.lineTo(x + Math.cos(t) * s * 0.62, y + Math.sin(t) * s * 0.62);
      ctx.stroke();
    }
  } else {
    // 木鸢：一对展开的木翅
    for (const d of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(x + d * s * 0.28, y, s * 0.36, s * 0.14, d * -0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#c98f55';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = INK;
      ctx.stroke();
    }
    circle(x, y, s * 0.12);
    ctx.fillStyle = BRASS_L;
    ctx.fill();
  }
  ctx.restore();
}

// 图纸条：每张图纸 = 机关小图 + 三个零件格；槽里已经有的零件亮起来，还差几个一眼看得到
function drawRecipes() {
  const L = S.L;
  const g = S.g;
  if (!g.partsOn || !g.recipes || !g.recipes.length) return;
  const n = g.recipes.length;
  const cw = Math.min(124, (W - 16) / n - 6);
  const ch = 38;
  const have = {};
  g.slots.forEach((s) => s && s.part && (have[s.part] = (have[s.part] || 0) + 1));
  S.recipePos = {};
  g.recipes.forEach((k, i) => {
    const x0 = W / 2 + (i - (n - 1) / 2) * (cw + 6) - cw / 2;
    const y0 = L.stripY - ch / 2;
    const want = core.RECIPES[k];
    const left = Object.assign({}, have);
    const got = want.map((p) => (left[p] > 0 ? (left[p]--, true) : false));
    const nGot = got.filter(Boolean).length;
    const ready = nGot === want.length - 1; // 「听牌」：只差一个
    const flash = S.huFlash && S.huFlash.k === k ? S.huFlash.t : 0;
    rr(x0, y0, cw, ch, 10);
    ctx.fillStyle = flash > 0 ? 'rgba(255,230,160,' + (0.25 + flash) + ')' : ready ? 'rgba(120,70,30,0.85)' : 'rgba(30,20,26,0.85)';
    ctx.fill();
    ctx.lineWidth = ready ? 2.5 : 1.5;
    ctx.strokeStyle = ready && Math.floor(S.time * 4) % 2 === 0 ? '#ffd27a' : BRASS_D;
    ctx.stroke();
    drawMachineIcon(x0 + 18, y0 + ch / 2, 30, k, ready);
    const pr = Math.min(12, (cw - 40) / 6.4);
    want.forEach((p, j) => drawPart(x0 + 40 + pr + j * (pr * 2 + 4), y0 + ch / 2, pr, p, 1, !got[j]));
    S.recipePos[k] = { x: x0 + cw / 2, y: y0 + ch / 2 };
  });
}

function drawHuText() {
  const h = S.huText;
  if (!h) return;
  const t = h.t;
  const s = t < 0.15 ? 0.6 + (t / 0.15) * 0.6 : t < 0.3 ? 1.2 - ((t - 0.15) / 0.15) * 0.2 : 1;
  const a = t > 1.0 ? Math.max(0, 1 - (t - 1.0) / 0.3) : 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(W / 2, S.L.by + S.L.bh * 0.42);
  ctx.scale(s, s);
  text(h.str, 0, 0, 44, '#ffe38a', 'center', INK);
  text(h.sub, 0, 40, 16, '#fff3c4', 'center', INK);
  ctx.restore();
}

// 新机制卡片（原作：整屏一张卡 + 大图 + 一句话 + 按钮）
function drawCard() {
  const c = S.card;
  ctx.fillStyle = 'rgba(10,6,10,0.72)';
  ctx.fillRect(0, 0, W, H);
  const cw = Math.min(320, W - 40);
  const ch = 300;
  const x0 = (W - cw) / 2;
  const y0 = H * 0.24;

  ctx.lineWidth = 3;
  ctx.strokeStyle = BRASS;
  ctx.stroke();
  text('新东西', W / 2, y0 + 32, 16, BRASS_L);
  if (c.kind === 'parts') {
    text('机关图纸', W / 2, y0 + 66, 26, '#fff3c4');
    // 三个零件 → 一只铜雀
    drawPart(W / 2 - 104, y0 + 132, 20, 'head');
    drawPart(W / 2 - 58, y0 + 132, 20, 'wing');
    drawPart(W / 2 - 12, y0 + 132, 20, 'wing');
    text('→', W / 2 + 28, y0 + 133, 26, BRASS_L);
    drawMachineIcon(W / 2 + 84, y0 + 132, 64, 'que', true);
    text('打掉的零件落进槽里，凑齐一张就合体', W / 2, y0 + 184, 15, '#e8dcc8');
    text('零件占格子；不要的点一下扔掉', W / 2, y0 + 208, 15, '#e8dcc8');
  } else {
    text('问号连弩', W / 2, y0 + 66, 26, '#fff3c4');
    // 一台露脸的 + 两台问号
    drawShooter(W / 2 - 70, y0 + 142, 30, { color: 4, ammo: 10, big: 0 });
    drawShooter(W / 2, y0 + 142, 26, { color: 0, ammo: 0, big: 0, hidden: true });
    drawShooter(W / 2 + 70, y0 + 142, 26, { color: 0, ammo: 0, big: 0, hidden: true });
    text('排到最前面才翻开颜色', W / 2, y0 + 202, 16, '#e8dcc8');
  }
  const bw = 160, bh = 48, bx = W / 2 - bw / 2, by = y0 + ch - 70;
  rr(bx, by, bw, bh, 24);
  ctx.fillStyle = BRASS;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();
  text('知道了', W / 2, by + bh / 2 + 1, 19, INK);
  S.buttons.push({ id: 'card', x: bx, y: by, w: bw, h: bh, fn: () => {
    save.seen[c.kind] = true;
    persist();
    S.card = null;
  } });
}

function drawHand(x, y, press) {
  ctx.save();
  ctx.translate(x, y);
  if (press > 0.8) {
    circle(-10, -14, 18 + (1 - press) * 20);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.stroke();
  }
  ctx.fillStyle = '#fff3e0';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  rr(-6, -14, 12, 30, 6);
  ctx.fill();
  ctx.stroke();
  rr(-6, 4, 26, 26, 9);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawFx() {
  for (const b of S.bullets) {
    if (!b.started) continue;
    const t = b.t / b.dur;
    const x = lerp(b.x0, b.x1, t);
    const y = lerp(b.y0, b.y1, t);
    ctx.lineWidth = 4;
    ctx.strokeStyle = COL[b.color].light;
    ctx.beginPath();
    ctx.moveTo(lerp(b.x0, b.x1, Math.max(0, t - 0.35)), lerp(b.y0, b.y1, Math.max(0, t - 0.35)));
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
  }
  for (const p of S.parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = p.soft ? a * 0.7 : Math.min(1, a * 1.6);
    ctx.fillStyle = p.color;
    const s = p.size * (p.soft ? 1.4 - a * 0.4 : 0.6 + a * 0.4);
    if (p.soft) {
      circle(p.x, p.y, s / 2);
      ctx.fill();
    } else if (p.spin) {
      // 崩飞的像素块：边飞边转
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin * (p.max - p.life));
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    } else ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  // 打掉的那一格白闪一下、往外胀
  for (const q of S.pops) {
    const t = q.t / 0.18;
    const s = S.L.cs * (1 + t * 0.6);
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = t < 0.4 ? '#ffffff' : q.color;
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  for (const r of S.rings) {
    if (r.t < 0) continue;
    const t = r.t / r.dur;
    circle(r.x, r.y, lerp(r.r0, r.r1, ease(t)));
    ctx.lineWidth = (r.w || 4) * (1 - t) + 1;
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = 1 - t;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const f of S.floaters) {
    const t = f.t / 0.9;
    ctx.globalAlpha = 1 - t;
    if (f.text) text(f.text, f.x, f.y - t * 30, 14, '#ff8a7a', 'center', INK);
    else petIcon(f.pet, f.x, f.y - t * 30, 26);
  }
  ctx.globalAlpha = 1;
  // 铜雀飞过棋盘
  if (S.birdFly) {
    const b = S.birdFly;
    const t = Math.min(1, b.t / b.dur);
    ART.bird(ctx, lerp(b.x0, b.x1, t), lerp(b.y0, b.y1, t) - Math.sin(t * Math.PI) * 30, 34, -0.2);
  }
}

function petIcon(id, x, y, s) {
  if (id === 'que') {
    ART.bird(ctx, x, y, s, 0);
  } else if (id === 'dog') {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#a0683a';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    rr(-s * 0.45, -s * 0.15, s * 0.8, s * 0.4, 4);
    ctx.fill();
    ctx.stroke();
    rr(s * 0.15, -s * 0.45, s * 0.35, s * 0.35, 4);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#6b4630';
    ctx.fillRect(-s * 0.4, s * 0.25, s * 0.12, s * 0.2);
    ctx.fillRect(s * 0.15, s * 0.25, s * 0.12, s * 0.2);
    ctx.fillStyle = INK;
    ctx.fillRect(s * 0.33, -s * 0.33, s * 0.06, s * 0.06);
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.fillStyle = '#7aa86a';
    ctx.beginPath();
    ctx.arc(0, s * 0.1, s * 0.42, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    circle(s * 0.5, s * 0.02, s * 0.14);
    ctx.fill();
    ctx.stroke();
    ART.gear(ctx, 0, -s * 0.08, s * 0.16, 7, BRASS, S.time, 1.2);
    ctx.globalAlpha *= 0.7;
    circle(-s * 0.1, -s * 0.5, s * 0.1);
    ctx.fillStyle = '#ece6dc';
    ctx.fill();
    ctx.restore();
  }
}

function button(id, x, y, w, h, label, kind, fn, sub) {
  rr(x, y, w, h, h / 2);
  ctx.fillStyle = kind === 'primary' ? '#f2b84b' : kind === 'ad' ? '#3fa66b' : '#3a2c33';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  if (kind === 'primary' || kind === 'ad') {
    rr(x + 4, y + 3, w - 8, h * 0.38, h * 0.2);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fill();

  // 三台合体：齿轮咬合 + 往上冲
  merge: { len: 0.55, f: (t, n) => sq(160, t) * env(t, 0.001, 0.03) * 0.25 + sin(300 + 900 * t, t) * env(Math.max(0, t - 0.06), 0.02, 0.25) * (t > 0.06 ? 0.4 : 0) + n() * env(t, 0.002, 0.04) * 0.15 },
